name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  tags:
    exclude:
      - '*'

variables:
  - group: GitSSHGroup
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: solutionFile
    value: 'Octo.EneryIqDemo.sln'
  - name: artifactsFrameworkVersion
    value: 'net10.0'
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}
    
stages:
  - stage: Build
    jobs:
      - job: linux
        displayName: Docker build
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: update-build-number.yml
          - checkout: self
            clean: true
            submodules: recursive
          - task: InstallSSHKey@0
            inputs:
              knownHostsEntry: '$(SSHKnownHosts)'
              sshPublicKey: '$(SSHPublicKey)'
              sshPassphrase: '$(SSHPassphrase)'
              sshKeySecureFile: '$(SSHPrivateKeyFile)'
          - template: set-version.yml
          - template: download-ca.yml
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(SolutionFile)'
              restoreArguments: '--force /p:OctoNugetPrivateServer=$(nugetPrivateServer)'
              noCache: true
          - task: DotNetCoreCLI@2
            displayName: 'Test'
            inputs:
              command: 'test'
              projects: |
                '**/*Tests.csproj'
                !'**/*SystemTests.csproj'
              testRunTitle: 'CI'
          # ---- CK model: compile + publish to the shared CK catalogs ----
          # OctoPublishCkModel=true is already set in the .csproj, so passing
          # OctoPublishCatalog + the GitHub API keys makes the MsBuildTasks
          # compile AND publish EnergyIQ (version from ckModel.yaml) during the
          # build — same pattern as meshmakers-app and octo-construction-kit.
          # Gated to main / r-tag so unreleased models never leak.
          #
          # Without this the model is only ever reachable via a manual ImportCk:
          # LibraryStatus shows CATALOG '-' and FixAll cannot repair the tenant.
          # That is what left EnergyIQ ResolveFailed on energyiq/prod-1 the
          # moment Basic.Energy was updated 1.1.4 -> 1.3.0.
          #
          # Catalog split mirrors the platform repos: main -> private only
          # (test-2), release -> private AND public (prod-1 reads ONLY the
          # PublicGitHubCatalog; the private catalog is not configured there).
          #
          # NOTE: CkCompile pins the ckModel.yaml dependency RANGE to a concrete
          # version resolved from the catalog at build time. Publishing alone
          # therefore does not keep the model healthy across dependency bumps —
          # this repo must also be rebuilt+republished whenever Basic.Energy or
          # Basic changes.
          - task: DotNetCoreCLI@2
            displayName: 'Publish CK model to PrivateGitHubCatalog'
            condition: and(succeeded(), or(eq(variables.isMain, true), eq(variables.isRelease, true)))
            inputs:
              command: 'build'
              projects: 'src/**/*CkModel.csproj'
              arguments: >-
                --configuration $(buildConfiguration)
                -p:OctoNugetPrivateServer=$(nugetPrivateServer)
                /p:OctoPublishCkModel=true
                /p:OctoPublishCatalog="PrivateGitHubCatalog"
                /p:OctoPrivateGitHubApiKey=$(GitHubPAT)
                /p:OctoPublicGitHubApiKey=$(GitHubPAT)
              publishWebProjects: false
              zipAfterPublish: false
              modifyOutputPath: false
          - task: DotNetCoreCLI@2
            displayName: 'Publish CK model to PublicGitHubCatalog (release)'
            condition: and(succeeded(), eq(variables.isRelease, true))
            inputs:
              command: 'build'
              projects: 'src/**/*CkModel.csproj'
              arguments: >-
                --configuration $(buildConfiguration)
                -p:OctoNugetPrivateServer=$(nugetPrivateServer)
                /p:OctoPublishCkModel=true
                /p:OctoPublishCatalog="PublicGitHubCatalog"
                /p:OctoPrivateGitHubApiKey=$(GitHubPAT)
                /p:OctoPublicGitHubApiKey=$(GitHubPAT)
              publishWebProjects: false
              zipAfterPublish: false
              modifyOutputPath: false
#          - template: build-and-push-docker-image.yml
#            parameters:
#              PublicRegistryServiceConnection: $(DockerRegistryPublicAcrConnection)
#              PrivateRegistryName: $(DockerRegistryPrivateUri)
#              PublicRegistryName: $(DockerRegistryInternalUri)
#              Repository: meshmakers/octo-template
#              Dockerfile: src/Template/Dockerfile
          - template: handle-artifacts.yml
 

