name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  tags:
    exclude:
      - '*'

resources:
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v1.2.1

variables:
  - group: GitSSHGroup
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: solutionFile
    value: 'Octo.EneryIqDemo.sln'
  - name: artifactsFrameworkVersion
    value: 'net10.0'
  - name: buildConfiguration
    value: 'Release'
  - name: buildPlatform
    value: 'Any CPU'
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}

stages:
  - stage: Build
    jobs:
      - job: linux
        displayName: Docker build
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
          - checkout: self
            clean: true
            submodules: recursive
          - task: InstallSSHKey@0
            inputs:
              knownHostsEntry: '$(SSHKnownHosts)'
              sshPublicKey: '$(SSHPublicKey)'
              sshPassphrase: '$(SSHPassphrase)'
              sshKeySecureFile: '$(SSHPrivateKeyFile)'
          - template: set-version.yml
          - template: download-ca.yml
          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '$(SolutionFile)'
              restoreArguments: '--force /p:OctoNugetPrivateServer=$(nugetPrivateServer)'
              noCache: true
          # Test builds the solution, the CK model included. It compiles EnergyIQ and
          # publishes it nowhere (/p:OctoPublishCkModel=false overrides the csproj):
          # the shared CK step below owns publishing. The GitHub API keys keep
          # CkCompile's catalog refresh clear of GitHub's unauthenticated rate limit.
          - task: DotNetCoreCLI@2
            displayName: 'Test'
            inputs:
              command: 'test'
              arguments: >-
                /p:OctoNugetPrivateServer=$(nugetPrivateServer)
                /p:OctoPublishCkModel=false
                /p:OctoPrivateGitHubApiKey=$(GitHubPAT)
                /p:OctoPublicGitHubApiKey=$(GitHubPAT)
              projects: |
                '**/*Tests.csproj'
                !'**/*SystemTests.csproj'
              testRunTitle: 'CI'
          # ---- CK model: validate + publish through the shared step (AB#5121) ----
          # Version and schema gate on every build, then main -> PrivateGitHubCatalog
          # (test-2), r* tags -> private AND PublicGitHubCatalog (prod-1 reads ONLY the
          # public catalog), never replacing a published version; every other branch
          # validates only. It runs after Test, so a run whose build or tests fail has
          # published nothing. It compiles the model itself with the octo-ckc of the
          # build's version line and needs nothing from the build.
          #
          # Without the publish the model is only ever reachable via a manual ImportCk:
          # LibraryStatus shows CATALOG '-' and FixAll cannot repair the tenant. That is
          # what left EnergyIQ ResolveFailed on energyiq/prod-1 the moment Basic.Energy
          # was updated 1.1.4 -> 1.3.0.
          #
          # NOTE: compiling pins the ckModel.yaml dependency RANGE to a concrete version
          # resolved from the catalog at build time. Publishing alone therefore does not
          # keep the model healthy across dependency bumps — this repo must also be
          # rebuilt and republished, with a version bump, whenever Basic.Energy or Basic
          # changes.
          - template: templates/steps/validate-and-publish-ck-versions.yml@pipelineTemplates
            parameters:
              constructionKitPaths:
                - 'src/EnergyIqCkModel/ConstructionKit'
#          - template: build-and-push-docker-image.yml
#            parameters:
#              PublicRegistryServiceConnection: $(DockerRegistryPublicAcrConnection)
#              PrivateRegistryName: $(DockerRegistryPrivateUri)
#              PublicRegistryName: $(DockerRegistryInternalUri)
#              Repository: meshmakers/octo-template
#              Dockerfile: src/Template/Dockerfile
          - template: handle-artifacts.yml
 

