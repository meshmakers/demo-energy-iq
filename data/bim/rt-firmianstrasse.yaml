  # --- Kühlkreis (Passivkühlung) ---
  # Passive cooling circuit. It reuses the SAME reversible plant as the heating
  # circuit (heat pump in PassiveCooling mode via the changeover valve, the buffer
  # tank, and the circulation pump). This is the textbook N:N SystemMembers case:
  # HeatPump / ThermalEnergyStorage / Pump each belong to BOTH the Heizkreis (…6000d1)
  # and this Kühlkreis — a relationship the spatial ParentChild tree cannot express.
  - rtId: 6789a00000000000006000d4
    ckTypeId: EnergyIQ/DistributionSystem
    attributes:
      - id: System/Name
        value: Kühlkreis Hauptgebäude (Passivkühlung)
      - id: System/Description
        value: Passive Kühlung über die reversiblen Fußbodenheizkreise (Wärmepumpe im Passivkühlmodus, Umschaltventil V-Umschalt-HzgKlt)
      - id: EnergyIQ/DistributionSystemTypeValue
        value: 1  # Cooling
    associations:
      - roleId: EnergyIQ/SystemMembers
        targetRtId: 6789a00000000000000060f1  # Wärmepumpe (reversibel)
        targetCkTypeId: EnergyIQ/HeatPump
      - roleId: EnergyIQ/SystemMembers
        targetRtId: 6789a00000000000000062f3  # Heizkreispumpe
        targetCkTypeId: EnergyIQ/Pump
      # The changeover valve is what turns the shared reversible loop into the cooling circuit
      # (ChangeoverHeatingCooling) — the identifying member of THIS system. The heating buffer
      # (…63f4) is intentionally NOT a member here: it is hydraulically bypassed in cooling mode
      # (a Heizpufferspeicher is not condensation-safe below dew point, and passive cooling wants
      # minimal thermal mass). It stays a member of the heating circuit only.
      - roleId: EnergyIQ/SystemMembers
        targetRtId: 6789a00000000000000060f2  # V-Umschalt-HzgKlt (ChangeoverHeatingCooling)
        targetCkTypeId: EnergyIQ/Valve
      # IfcRelServicesBuildings: passive cooling serves the same 3 Hauptgebäude storeys.
      - roleId: EnergyIQ/SystemSpaces
        targetRtId: 6789a00000000000000010c1  # storey-hg-eg (EG)
        targetCkTypeId: EnergyIQ/BuildingStorey
      - roleId: EnergyIQ/SystemSpaces
        targetRtId: 6789a00000000000000020c2  # storey-hg-og (OG)
        targetCkTypeId: EnergyIQ/BuildingStorey
      - roleId: EnergyIQ/SystemSpaces
        targetRtId: 6789a00000000000000030c3  # storey-hg-dg (DG)
        targetCkTypeId: EnergyIQ/BuildingStorey

