$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- System.Communication-[3.12,)
- Loxone-[2.0,)
entities:

  # ==========================================================================
  # DataFlow: Loxone Browse & Discover
  #
  # Single pipeline flow: manually triggered, browses the Miniserver structure
  # ==========================================================================
  - rtId: 67f0b00ec4ff02221e0b6001
    ckTypeId: System.Communication/DataFlow
    attributes:
    - id: System/Name
      value: Loxone Browse Structure
    - id: System/Description
      value: Discovers and browses the Loxone Miniserver structure (rooms, categories, controls)

  - rtId: 67f0b00ec4ff02221e0b6002
    ckTypeId: System.Communication/Pipeline
    associations:
    - roleId: System/ParentChild
      targetRtId: 67f0b00ec4ff02221e0b6001
      targetCkTypeId: System.Communication/DataFlow
    - roleId: System.Communication/Executes
      targetRtId: 67f0a01ec4ff02221e0b5001
      targetCkTypeId: System.Communication/Adapter
    - roleId: System.Communication/Uses
      targetRtId: 67f0c00ec4ff02221e0b7001
      targetCkTypeId: System.Communication/LoxoneConfiguration
    attributes:
    - id: System/Name
      value: Browse Miniserver
    - id: System/Enabled
      value: true
    - id: System.Communication/PipelineDefinition
      value: |-
        triggers:
          - type: FromExecutePipelineCommand@1
        transformations:
          - type: GetPipelineConfigByWellKnownName@1
            description: Load Loxone connection configuration
            wellKnownName: LoxoneMiniserverConfig
            targetPath: $.config
          - type: LoxoneBrowse@1
            description: Browse Miniserver structure
            hostPath: $.config.host
            portPath: $.config.port
            usernamePath: $.config.username
            passwordPath: $.config.password
            useSslPath: $.config.isSslEnabled
            targetPath: $.structure
          - type: SetPipelineExecutionResult@1
            description: Store browse result for visualization
            path: $.structure

  # ==========================================================================
  # DataFlow: Loxone Sync Structure
  #
  # 2-pipeline flow across edge and mesh adapter:
  #   1. Edge Adapter: Fetch Miniserver structure, send to mesh
  #   2. Mesh Adapter: Receive structure, create/update RT entities
  # ==========================================================================
  - rtId: 67f0b00ec4ff02221e0b6003
    ckTypeId: System.Communication/DataFlow
    attributes:
    - id: System/Name
      value: Loxone Sync Structure
    - id: System/Description
      value: Fetches Loxone Miniserver structure and synchronizes it as OctoMesh runtime entities

  # Pipeline 1: Fetch structure on Edge Adapter, send to Mesh
  - rtId: 67f0b00ec4ff02221e0b6004
    ckTypeId: System.Communication/Pipeline
    associations:
    - roleId: System/ParentChild
      targetRtId: 67f0b00ec4ff02221e0b6003
      targetCkTypeId: System.Communication/DataFlow
    - roleId: System.Communication/Executes
      targetRtId: 67f0a01ec4ff02221e0b5001
      targetCkTypeId: System.Communication/Adapter
    - roleId: System.Communication/Uses
      targetRtId: 67f0c00ec4ff02221e0b7001
      targetCkTypeId: System.Communication/LoxoneConfiguration
    attributes:
    - id: System/Name
      value: Fetch Structure
    - id: System/Description
      value: Fetches Miniserver structure and sends sync data to mesh adapter
    - id: System/Enabled
      value: true
    - id: System.Communication/PipelineDefinition
      value: |-
        triggers:
          - type: FromExecutePipelineCommand@1
        transformations:
          - type: GetPipelineConfigByWellKnownName@1
            description: Load Loxone connection configuration
            wellKnownName: LoxoneMiniserverConfig
            targetPath: $.config
          - type: LoxoneBrowse@1
            description: Fetch Miniserver structure
            hostPath: $.config.host
            portPath: $.config.port
            usernamePath: $.config.username
            passwordPath: $.config.password
            useSslPath: $.config.isSslEnabled
            targetPath: $.structure
          - type: ToPipelineDataEvent@1
            description: Send structure to mesh adapter for storage
            path: $.structure
            targetPath: $.structure
            targetPipelineRtId: 67f0b00ec4ff02221e0b6005

  # Pipeline 2: Receive on Mesh Adapter, create/update RT entities
  - rtId: 67f0b00ec4ff02221e0b6005
    ckTypeId: System.Communication/Pipeline
    associations:
    - roleId: System/ParentChild
      targetRtId: 67f0b00ec4ff02221e0b6003
      targetCkTypeId: System.Communication/DataFlow
    - roleId: System.Communication/Executes
      targetRtId: "670000000000000000000002"
      targetCkTypeId: System.Communication/Adapter
    attributes:
    - id: System/Name
      value: Store Structure
    - id: System/Description
      value: Receives Loxone structure and creates/updates OctoMesh runtime entities
    - id: System/Enabled
      value: true
    - id: System.Communication/PipelineDefinition
      value: |-
        triggers:
          - type: FromPipelineDataEvent@1
        transformations:
          # ── Miniserver (Tree root) ──
          # Find existing Miniserver by SerialNumber (or prepare insert)
          - type: GetOrCreateRtEntitiesByType@1
            description: Get or create Miniserver by SerialNumber
            ckTypeId: Loxone/Miniserver
            rtIdTargetPath: $._msRtId
            ckTypeIdTargetPath: $._msCkTypeId
            modOperationPath: $._msModOp
            fieldFilters:
              - attributePath: SerialNumber
                operator: Equals
                comparisonValuePath: $.structure.miniserver.serialNr
          - type: CreateUpdateInfo@1
            description: Create or update Miniserver entity
            targetPath: $._miniserverUpdate
            updateKindPath: $._msModOp
            ckTypeIdPath: $._msCkTypeId
            rtIdPath: $._msRtId
            attributeUpdates:
              - attributeName: Name
                attributeValueType: String
                valuePath: $.structure.miniserver.msName
              - attributeName: SerialNumber
                attributeValueType: String
                valuePath: $.structure.miniserver.serialNr
              - attributeName: FirmwareVersion
                attributeValueType: String
                valuePath: $.structure.miniserver.swVersion
              - attributeName: ProjectName
                attributeValueType: String
                valuePath: $.structure.miniserver.projectName
              - attributeName: MacAddress
                attributeValueType: String
                valuePath: $.structure.miniserver.macAddress

          # ── Rooms → Categories → Controls ──
          - type: ForEach@1
            description: Create rooms with categories and controls
            iterationPath: $.structure.rooms
            targetPath: $.roomResults
            mergePath: $.updates
            transformations:
              # Find existing Room by LoxoneUuid (or prepare insert)
              - type: GetOrCreateRtEntitiesByType@1
                description: Get or create Room by LoxoneUuid
                ckTypeId: Loxone/Room
                rtIdTargetPath: $.updates._roomRtId
                ckTypeIdTargetPath: $.updates._roomCkTypeId
                modOperationPath: $.updates._roomModOp
                fieldFilters:
                  - attributePath: LoxoneUuid
                    operator: Equals
                    comparisonValuePath: $.key.uuid
              # Create or update Room entity
              - type: CreateUpdateInfo@1
                targetPath: $.updates._roomUpdate
                updateKindPath: $.updates._roomModOp
                ckTypeIdPath: $.updates._roomCkTypeId
                rtIdPath: $.updates._roomRtId
                attributeUpdates:
                  - attributeName: Name
                    attributeValueType: String
                    valuePath: $.key.name
                  - attributeName: LoxoneUuid
                    attributeValueType: String
                    valuePath: $.key.uuid
                  - attributeName: RoomType
                    attributeValueType: Int
                    valuePath: $.key.type
                  - attributeName: Image
                    attributeValueType: String
                    valuePath: $.key.image
              # Room → Miniserver (only when Room was newly inserted)
              - type: If@1
                description: Create association only for new Rooms
                path: $.updates._roomModOp
                operator: Equals
                value: 0
                valueType: Int
                transformations:
                  - type: CreateAssociationUpdate@1
                    targetPath: $.updates._roomAssocUpdateItems
                    targetValueKind: Array
                    targetValueWriteMode: Append
                    updateKind: CREATE
                    originRtIdPath: $.updates._roomUpdate.RtId
                    originCkTypeIdPath: $.updates._roomUpdate.CkTypeId
                    targetRtIdPath: $.full._miniserverUpdate.RtId
                    targetCkTypeIdPath: $.full._miniserverUpdate.CkTypeId
                    associationRoleId: System/ParentChild
              # Categories in this Room
              - type: ForEach@1
                description: Create categories in room
                path: $.updates
                fullDocumentPath: $.full
                iterationPath: $.key.categories
                keyPath: $.category
                targetPath: $.updates._categoryResults
                mergePath: $.updates
                transformations:
                  # Find existing Category by LoxoneUuid (or prepare insert)
                  - type: GetOrCreateRtEntitiesByType@1
                    description: Get or create Category by LoxoneUuid
                    ckTypeId: Loxone/Category
                    rtIdTargetPath: $.updates._catRtId
                    ckTypeIdTargetPath: $.updates._catCkTypeId
                    modOperationPath: $.updates._catModOp
                    fieldFilters:
                      - attributePath: LoxoneUuid
                        operator: Equals
                        comparisonValuePath: $.category.uuid
                  - type: CreateUpdateInfo@1
                    targetPath: $.updates._catUpdate
                    updateKindPath: $.updates._catModOp
                    ckTypeIdPath: $.updates._catCkTypeId
                    rtIdPath: $.updates._catRtId
                    attributeUpdates:
                      - attributeName: Name
                        attributeValueType: String
                        valuePath: $.category.name
                      - attributeName: LoxoneUuid
                        attributeValueType: String
                        valuePath: $.category.uuid
                      - attributeName: CategoryType
                        attributeValueType: String
                        valuePath: $.category.type
                      - attributeName: Color
                        attributeValueType: String
                        valuePath: $.category.color
                      - attributeName: Image
                        attributeValueType: String
                        valuePath: $.category.image
                  # Category → Room (only when Category was newly inserted)
                  - type: If@1
                    description: Create association only for new Categories
                    path: $.updates._catModOp
                    operator: Equals
                    value: 0
                    valueType: Int
                    transformations:
                      - type: CreateAssociationUpdate@1
                        targetPath: $.updates._catAssocUpdateItems
                        targetValueKind: Array
                        targetValueWriteMode: Append
                        updateKind: CREATE
                        originRtIdPath: $.updates._catUpdate.RtId
                        originCkTypeIdPath: $.updates._catUpdate.CkTypeId
                        targetRtIdPath: $.full._roomUpdate.RtId
                        targetCkTypeIdPath: $.full._roomUpdate.CkTypeId
                        associationRoleId: System/ParentChild
                  # Controls in this Category
                  - type: ForEach@1
                    description: Create controls in category
                    path: $.updates
                    fullDocumentPath: $.full
                    iterationPath: $.category.controls
                    keyPath: $.control
                    targetPath: $.updates._controlResults
                    mergePath: $.updates
                    transformations:
                      # Find existing Control by LoxoneUuid (or prepare insert)
                      - type: GetOrCreateRtEntitiesByType@1
                        description: Get or create Control by LoxoneUuid
                        ckTypeId: Loxone/Control
                        rtIdTargetPath: $.updates._ctrlRtId
                        ckTypeIdTargetPath: $.updates._ctrlCkTypeId
                        modOperationPath: $.updates._ctrlModOp
                        fieldFilters:
                          - attributePath: LoxoneUuid
                            operator: Equals
                            comparisonValuePath: $.control.uuidAction
                      # Convert Loxone states map to RecordArray for the States attribute
                      - type: MapToRecordArray@1
                        description: Convert states map to DataPoint records
                        path: $.control.states
                        ckRecordId: System.Communication/DataPoint
                        keyAttributeName: Name
                        valueAttributeName: ExternalId
                        targetPath: $.updates._stateRecords
                        targetValueKind: Simple
                        targetValueWriteMode: Overwrite
                      - type: CreateUpdateInfo@1
                        targetPath: $.updates._ctrlUpdate
                        updateKindPath: $.updates._ctrlModOp
                        ckTypeIdPath: $.updates._ctrlCkTypeId
                        rtIdPath: $.updates._ctrlRtId
                        attributeUpdates:
                          - attributeName: Name
                            attributeValueType: String
                            valuePath: $.control.name
                          - attributeName: LoxoneUuid
                            attributeValueType: String
                            valuePath: $.control.uuidAction
                          - attributeName: ControlType
                            attributeValueType: String
                            valuePath: $.control.type
                          - attributeName: IsEnabled
                            attributeValueType: Boolean
                            value: true
                          - attributeName: States
                            attributeValueType: RecordArray
                            valuePath: $.updates._stateRecords
                      # Control → Category (only when Control was newly inserted)
                      - type: If@1
                        description: Create association only for new Controls
                        path: $.updates._ctrlModOp
                        operator: Equals
                        value: 0
                        valueType: Int
                        transformations:
                          - type: CreateAssociationUpdate@1
                            targetPath: $.updates._ctrlAssocUpdateItems
                            targetValueKind: Array
                            targetValueWriteMode: Append
                            updateKind: CREATE
                            originRtIdPath: $.updates._ctrlUpdate.RtId
                            originCkTypeIdPath: $.updates._ctrlUpdate.CkTypeId
                            targetRtIdPath: $.full._catUpdate.RtId
                            targetCkTypeIdPath: $.full._catUpdate.CkTypeId
                            associationRoleId: System/ParentChild

          # ── Flatten entities ──
          - type: Flatten@1
            path: $.roomResults[*]._roomUpdate
            targetPath: $._updateItems
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          - type: Flatten@1
            path: $.roomResults[*]._categoryResults[*]._catUpdate
            targetPath: $._updateItems
            targetValueWriteMode: Append
          - type: Flatten@1
            path: $.roomResults[*]._categoryResults[*]._controlResults[*]._ctrlUpdate
            targetPath: $._updateItems
            targetValueWriteMode: Append
          # Add miniserver
          - type: Flatten@1
            path: $._miniserverUpdate
            targetPath: $._updateItems
            targetValueWriteMode: Prepend
          # ── Flatten associations ──
          # Each nesting level uses a DISTINCT accumulator key. The nested ForEach children
          # inherit the parent's $.updates (parent-fallback) and mergePath collects the merged
          # view, so a shared key would replicate e.g. room→miniserver into every category/control
          # result and the flattens below would multiply it -> ParentChild max-multiplicity errors.
          - type: Flatten@1
            path: $.roomResults[*]._roomAssocUpdateItems[*]
            targetPath: $._assocUpdateItems
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          - type: Flatten@1
            path: $.roomResults[*]._categoryResults[*]._catAssocUpdateItems[*]
            targetPath: $._assocUpdateItems
            targetValueWriteMode: Append
          - type: Flatten@1
            path: $.roomResults[*]._categoryResults[*]._controlResults[*]._ctrlAssocUpdateItems[*]
            targetPath: $._assocUpdateItems
            targetValueWriteMode: Append
          # ── Apply ──
          - type: ApplyChanges@2
            entityUpdatesPath: $._updateItems
            associationUpdatesPath: $._assocUpdateItems

  # ==========================================================================
  # DataFlow: Loxone Live States
  #
  # 3-pipeline flow across edge and mesh adapter:
  #   0. Mesh Adapter: Configure State Sync - reads DataPointMappings, updates
  #      LoxoneConfiguration with UUIDs, redeploys edge pipeline
  #   1. Edge Adapter: Receive state changes via WebSocket, send to mesh
  #   2. Mesh Adapter: Receive states, apply data point mappings
  # ==========================================================================
  - rtId: 67f0b00ec4ff02221e0b6006
    ckTypeId: System.Communication/DataFlow
    attributes:
    - id: System/Name
      value: Loxone Live States
    - id: System/Description
      value: Receives real-time state changes from Loxone via WebSocket and applies DataPointMappings to update target entities

  # Pipeline 0: Configure State Sync (Mesh Adapter)
  # Reads DataPointMappings, extracts LoxoneUuids from source Controls,
  # updates the LoxoneConfiguration with the UUID list, and redeploys the edge pipeline.
  - rtId: 67f0b00ec4ff02221e0b6009
    ckTypeId: System.Communication/Pipeline
    associations:
    - roleId: System/ParentChild
      targetRtId: 67f0b00ec4ff02221e0b6006
      targetCkTypeId: System.Communication/DataFlow
    - roleId: System.Communication/Executes
      targetRtId: "670000000000000000000002"
      targetCkTypeId: System.Communication/Adapter
    attributes:
    - id: System/Name
      value: Configure State Sync
    - id: System/Description
      value: Reads DataPointMappings to determine which controls to watch, updates LoxoneConfiguration with MappingTargets, and redeploys the edge pipeline
    - id: System/Enabled
      value: true
    - id: System.Communication/PipelineDefinition
      value: |-
        triggers:
          - type: FromExecutePipelineCommand@1
        transformations:
          # Build poll targets from DataPointMappings. Each target is either a plain
          # control UUID (default poll) or "controlUuid|stateName|stateUuid" for
          # polling specific states (e.g. tempActual) from controls with multiple states.
          - type: BuildMappingTargets@1
            description: Resolve mapping sources to external identifiers
            sourceCkTypeId: Loxone/Control
            sourceIdentifierAttribute: LoxoneUuid
            statesAttribute: States
            stateKeyAttribute: Name
            stateValueAttribute: ExternalId
            defaultAttributePath: currentValue
            targetPath: $.mappingTargets
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          # Load the current LoxoneConfiguration
          - type: GetRtEntitiesByType@1
            description: Load LoxoneConfiguration
            ckTypeId: System.Communication/LoxoneConfiguration
            targetPath: $.configs
            fieldFilters:
              - attributePath: Host
                operator: NotEquals
                comparisonValue: null
          # Update the configuration with the resolved mapping targets
          - type: If@1
            description: Only update if configuration exists
            path: $.configs.Items[0].RtId
            operator: NotEquals
            value: null
            valueType: String
            transformations:
              - type: CreateUpdateInfo@1
                description: Update MappingTargets on LoxoneConfiguration
                targetPath: $._configUpdate
                targetValueKind: Array
                updateKind: UPDATE
                ckTypeIdPath: $.configs.Items[0].CkTypeId.SemanticVersionedFullName
                rtIdPath: $.configs.Items[0].RtId
                attributeUpdates:
                  - attributeName: MappingTargets
                    attributeValueType: RecordArray
                    valuePath: $.mappingTargets
              - type: ApplyChanges@2
                entityUpdatesPath: $._configUpdate
              # Redeploy the edge state sync pipeline with updated configuration
              - type: DeployPipeline@1
                description: Redeploy edge state sync pipeline
                pipelineRtId: 67f0b00ec4ff02221e0b6007
                serviceAccountConfigName: ServiceAccountConfig
          - type: SetPipelineExecutionResult@1
            description: Store configuration result
            path: $.configs.Items[0].RtId

  # Pipeline 1: Receive state changes on Edge Adapter (WebSocket)
  - rtId: 67f0b00ec4ff02221e0b6007
    ckTypeId: System.Communication/Pipeline
    associations:
    - roleId: System/ParentChild
      targetRtId: 67f0b00ec4ff02221e0b6006
      targetCkTypeId: System.Communication/DataFlow
    - roleId: System.Communication/Executes
      targetRtId: 67f0a01ec4ff02221e0b5001
      targetCkTypeId: System.Communication/Adapter
    - roleId: System.Communication/Uses
      targetRtId: 67f0c00ec4ff02221e0b7001
      targetCkTypeId: System.Communication/LoxoneConfiguration
    attributes:
    - id: System/Name
      value: Receive State Changes
    - id: System/Description
      value: Receives real-time state changes from Loxone Miniserver via WebSocket and sends them to mesh adapter
    - id: System/Enabled
      value: true
    - id: System.Communication/PipelineDefinition
      value: |-
        triggers:
          - type: FromLoxoneStateChange@1
            configurationName: LoxoneMiniserverConfig
        transformations:
          # States array is provided by the trigger (only changed values)
          - type: ToPipelineDataEvent@1
            description: Send changed states to mesh adapter
            path: $.states
            targetPath: $.states
            targetPipelineRtId: 67f0b00ec4ff02221e0b6008

  # Pipeline 2: Receive states on Mesh Adapter, update entities
  - rtId: 67f0b00ec4ff02221e0b6008
    ckTypeId: System.Communication/Pipeline
    associations:
    - roleId: System/ParentChild
      targetRtId: 67f0b00ec4ff02221e0b6006
      targetCkTypeId: System.Communication/DataFlow
    - roleId: System.Communication/Executes
      targetRtId: "670000000000000000000002"
      targetCkTypeId: System.Communication/Adapter
    attributes:
    - id: System/Name
      value: Store Control States
    - id: System/Description
      value: Receives polled state data and updates OctoMesh runtime entities
    - id: System/Enabled
      value: true
    - id: System.Communication/PipelineDefinition
      value: |-
        triggers:
          - type: FromPipelineDataEvent@1
        transformations:
          # For each state update, find matching control and apply data point mappings
          - type: ForEach@1
            description: Process state updates and apply data point mappings
            iterationPath: $.states
            targetPath: $.updateResults
            mergePath: $.updates
            transformations:
              # Find ALL Loxone Controls matching this state's UUID (handles duplicates)
              - type: GetRtEntitiesByType@1
                description: Find all controls by Loxone UUID
                ckTypeId: Loxone/Control
                targetPath: $.updates._controls
                fieldFilters:
                  - attributePath: LoxoneUuid
                    operator: Equals
                    comparisonValuePath: $.key.controlUuid
              # For each matching control, update its state and apply its mappings
              - type: ForEach@1
                description: Process each matching control
                path: $
                fullDocumentPath: $.full
                iterationPath: $.updates._controls.Items
                targetPath: $.updates._controlResults
                mergePath: $.updates
                transformations:
                  # Update the matching DataPoint record in the States RecordArray
                  - type: UpdateRecordArrayItem@1
                    description: Update CurrentValue and LastUpdate in States record
                    path: $.key.Attributes.States
                    matchAttributeName: ExternalId
                    matchValuePath: $.full.key.pollUuid
                    targetPath: $.updates._updatedStates
                    attributeUpdates:
                      - attributeName: CurrentValue
                        valuePath: $.full.key.value
                      - attributeName: LastUpdate
                        value: =now()
                  - type: CreateUpdateInfo@1
                    description: Update Control's States and LastStateUpdate
                    targetPath: $.updates._controlUpdate
                    updateKind: UPDATE
                    ckTypeIdPath: $.key.CkTypeId.SemanticVersionedFullName
                    rtIdPath: $.key.RtId
                    attributeUpdates:
                      - attributeName: States
                        attributeValueType: RecordArray
                        valuePath: $.updates._updatedStates
                      - attributeName: LastStateUpdate
                        attributeValueType: DateTime
                        value: =now()
                  # Evaluate DataPointMappings for this specific control and state.
                  # sourceStateNamePath filters mappings: only those matching the state name apply.
                  - type: ApplyDataPointMappings@1
                    description: Apply data point mappings to target entities
                    sourceRtIdPath: $.key.RtId
                    sourceCkTypeIdPath: $.key.CkTypeId.SemanticVersionedFullName
                    sourceValuePath: $.full.key.value
                    sourceStateNamePath: $.full.key.stateName
                    targetPath: $.updates._mappingUpdates
                    targetValueKind: Array
                    targetValueWriteMode: Overwrite
          # Flatten control updates from all matches across all states
          - type: Flatten@1
            path: $.updateResults[*]._controlResults[*]._controlUpdate
            targetPath: $._updateItems
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          # Flatten mapping updates (double wildcard - mappingUpdates is array-of-arrays)
          - type: Flatten@1
            path: $.updateResults[*]._controlResults[*]._mappingUpdates[*][*]
            targetPath: $._updateItems
            targetValueWriteMode: Append
          - type: If@1
            description: Only apply if there are updates
            path: $._updateItems[0].RtId
            operator: NotEquals
            value: null
            valueType: String
            transformations:
              # Update entities in MongoDB
              - type: ApplyChanges@2
                entityUpdatesPath: $._updateItems
              # EnergyIQ-2.0.0: measurements live on dedicated Sensor entities, so the
              # previous single SpaceArchive has been split into per-type archives
              # (13 in total since AB#3442: room sensors, light, shading, energy
              # consumption and production — see rt-archives-energyiq.yaml).
              # Each Backfill+Save block iterates over $._updateItems but the archive
              # node itself filters to entities matching its TargetCkTypeId — items of
              # other types are skipped. So the same path is fed to each archive in turn.
              #
              # ── Temperature ──
              - type: BackfillFromRtEntity@1
                description: Backfill TemperatureSensor archive
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0001
              - type: SaveStreamDataInArchive@1
                description: Save Temperature time-series
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0001
              # ── Humidity ──
              - type: BackfillFromRtEntity@1
                description: Backfill HumiditySensor archive
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0002
              - type: SaveStreamDataInArchive@1
                description: Save Humidity time-series
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0002
              # ── CO2 ──
              - type: BackfillFromRtEntity@1
                description: Backfill CO2Sensor archive
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0003
              - type: SaveStreamDataInArchive@1
                description: Save CO2 time-series
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0003
              # ── Light + shading (AB#3442) ──
              - type: BackfillFromRtEntity@1
                description: Backfill Luminaire archive
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0004
              - type: SaveStreamDataInArchive@1
                description: Save Luminaire time-series
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0004
              - type: BackfillFromRtEntity@1
                description: Backfill ShadingDevice archive
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0005
              - type: SaveStreamDataInArchive@1
                description: Save ShadingDevice time-series
                path: $._updateItems
                archiveRtId: 6a0e000000000000000a0005
              # ── Energy consumption (AB#3442) ──
