  # ==========================================================================
  # DataFlow: Loxone Auto-Map Controls
  #
  # Single mesh pipeline: uses AnthropicAiQuery to match Loxone Controls
  # to EnergyIQ Spaces (or other target entities) and creates
  # DataPointMapping entities automatically.
  #
  # Prerequisites:
  #   - Loxone structure has been synced (DataFlow 2)
  #   - EnergyIQ building model exists (imported or created manually)
  #   - AnthropicAiConfiguration entity with API key exists
  #
  # Run this pipeline once after sync, or whenever mappings need updating.
  # It is idempotent: existing DataPointMappings are skipped.
  # After this pipeline, run "Configure Polling" to activate the new mappings.
  # ==========================================================================
  - rtId: 67f0b00ec4ff02221e0b600a
    ckTypeId: System.Communication/DataFlow
    attributes:
    - id: System/Name
      value: Loxone Auto-Map Controls
    - id: System/Description
      value: Uses AI to match Loxone Controls to EnergyIQ entities and creates DataPointMapping entities automatically

  # AI Auto-Map, v2-aware. The AI navigates the live EnergyIQ v2 model via MCP and
  # returns, per mapping, the TARGET ENTITY rtId — a Sensor entity (TemperatureSensor /
  # HumiditySensor / CO2Sensor / IlluminanceSensor / PresenceSensor reached via
  # SpaceSensors), a Luminaire / ShadingDevice (via SpaceElements), the Space itself
  # (for the tempTarget Pset design value), or a building-level energy entity
  # (GridConnection / PhotovoltaicSystem / BatteryStorage / Meter / ChargingStation).
  # This is the LLM-driven, fuzzy-matching counterpart to the deterministic
  # Rules-based Auto-Map (67f0b00ec4ff02221e0b600c) — same suggestion shape, same
  # downstream GetOrCreate/CreateUpdateInfo/CreateAssociationUpdate Step 3.
  - rtId: 67f0b00ec4ff02221e0b600b
    ckTypeId: System.Communication/Pipeline
    associations:
    - roleId: System/ParentChild
      targetRtId: 67f0b00ec4ff02221e0b600a
      targetCkTypeId: System.Communication/DataFlow
    - roleId: System.Communication/Executes
      targetRtId: "670000000000000000000002"
      targetCkTypeId: System.Communication/Adapter
    - roleId: System.Communication/Uses
      targetRtId: 67f0c00ec4ff02221e0b7003
      targetCkTypeId: System.Communication/AiConfiguration
    attributes:
    - id: System/Name
      value: AI Auto-Map
    - id: System/Description
      value: "v2-aware. Uses Claude + MCP to match Loxone Controls to EnergyIQ v2 entities (room Sensor entities via SpaceSensors, Luminaire/ShadingDevice via SpaceElements, building-level energy entities) and creates DataPointMapping entities. LLM counterpart to the deterministic Rules-based Auto-Map."
    - id: System/Enabled
      value: true
    - id: System.Communication/PipelineDefinition
      value: |-
        triggers:
          - type: FromExecutePipelineCommand@1
        transformations:
          # ── Step 1: AI queries data via MCP and produces mapping suggestions ──
          # Claude uses MCP tools to query only the fields it needs (Name, ControlType,
          # States, RtId, associations) instead of loading full entities into the context.

          - type: AnthropicAiQuery@1
            description: Match Loxone Controls to EnergyIQ entities via MCP
            apiKeyConfigurationName: AnthropicAiConfig
            # AB#4315: the MCP server now enforces auth — authenticate via the shared
            # ServiceAccountConfiguration (client octo-pipelines) so the MCP tools load.
            mcpServiceAccountConfigName: ServiceAccountConfig
            maxToolRounds: 16
            mcpToolNames:
              - query_entities_simple
              - navigate_associations
              - get_association_tree
            responseFormat: json
            temperature: 0.0
            # 32k output head-room (claude-sonnet-4-6 supports 64k): a full mapping run emits
            # ~60+ entries; 16k got cut off mid-array (stop_reason max_tokens) and the truncated
            # JSON then failed the downstream ForEach with "value ... is not an array".
            maxTokens: 32000
            systemPrompt: |-
              You are a building-automation mapping assistant for OctoMesh. You map Loxone
              Miniserver controls to the EnergyIQ v2 building model by querying the live data
              via MCP tools, then emit DataPointMapping suggestions as a JSON array.

              EnergyIQ v2 TARGET MODEL — read carefully. Measurements live on DEDICATED
              entities, NOT as attributes on Space:
              - Room climate sensors are separate entities linked to a Space via the
                EnergyIQ/SpaceSensors role. The MAPPING TARGET is the SENSOR entity's rtId and
                targetAttributePath is ALWAYS "CurrentValue" (every sensor subtype renames its
                typed value attribute — id Temperature/Humidity/CO2Level/… — to that uniform
                NAME, and mappings resolve attributes by NAME):
                  EnergyIQ/TemperatureSensor  -> targetAttributePath "CurrentValue"
                  EnergyIQ/HumiditySensor     -> targetAttributePath "CurrentValue"
                  EnergyIQ/CO2Sensor          -> targetAttributePath "CurrentValue"
                  EnergyIQ/IlluminanceSensor  -> targetAttributePath "CurrentValue"
                  EnergyIQ/PresenceSensor     -> targetAttributePath "CurrentValue"
              - Lighting/shading are building elements linked via EnergyIQ/SpaceElements:
                  EnergyIQ/Luminaire     -> "DimmingLevel"
                  EnergyIQ/ShadingDevice -> "Position"
              - The heating setpoint (Loxone tempTarget) is a DESIGN value on the Space itself
                (no sensor): target the EnergyIQ/Space rtId, targetAttributePath
                "thermalRequirements.spaceTemperature" (attribute NAME path, not the
                attribute id "ThermalRequirementsRecord").
              - Building-level energy entities (NOT room-scoped), matched by Name:
                  EnergyIQ/GridConnection, EnergyIQ/PhotovoltaicSystem, EnergyIQ/BatteryStorage,
                  EnergyIQ/Meter, EnergyIQ/ChargingStation.

              STEP 1 — QUERY THE DATA (reuse results; do not re-query):
              a) Loxone controls grouped by room:
                 get_association_tree(rootCkTypeId="Loxone/Room", ckRoleId="System/ParentChild",
                   direction="Inbound", maxDepth=2, attributePaths=["Name","ControlType"])
                 -> each Room node (Name) -> Category children -> Control children. Every control
                 node carries RtId and ControlType. Do NOT request States or LoxoneUuid — the
                 state names you need per ControlType are listed below, and requesting more
                 attributes makes the result exceed the tool output limit (truncated data).
              b) EnergyIQ spaces with their sensors:
                 get_association_tree(rootCkTypeId="EnergyIQ/Space", ckRoleId="EnergyIQ/SpaceSensors",
                   direction="Inbound", maxDepth=1, attributePaths=["Name"])
                 -> each Space node's children are its Sensor entities. Read each child's CkTypeId
                 to know the sensor TYPE (EnergyIQ/TemperatureSensor, EnergyIQ/CO2Sensor, ...) and
                 its RtId. (Optionally the same call with ckRoleId="EnergyIQ/SpaceElements" gives
                 the room's Luminaire/ShadingDevice.)
              c) Energy entities — one call each, attributePaths=["Name"]:
                 query_entities_simple(ckTypeId="EnergyIQ/GridConnection"), and likewise for
                 EnergyIQ/PhotovoltaicSystem, EnergyIQ/BatteryStorage, EnergyIQ/Meter,
                 EnergyIQ/ChargingStation.
              d) Loxone energy controls (they may sit under any room; query them directly):
                 query_entities_simple(ckTypeId="Loxone/Control", filters={"ControlType":"EnergyManager2"},
                   attributePaths=["Name","ControlType"]) and likewise for
                 ControlType "Meter" and "Wallbox2". Again: no States, no LoxoneUuid.

              STEP 2 — ROOM SENSOR MAPPINGS:
              Match each Loxone Room.Name to an EnergyIQ Space.Name (exact first, then
              case/diacritic/whitespace-insensitive). For each matched room's controls, target the
              SENSOR/element entity rtId of the right TYPE from step (b).
              IMPORTANT: every v2 Sensor subtype renames its typed value attribute to the uniform
              NAME "CurrentValue" — targetAttributePath for ALL sensors is "CurrentValue".
              - IRoomControllerV2 (multi-state), per state:
                  tempActual    -> the room's TemperatureSensor, "CurrentValue"
                  co2           -> the room's CO2Sensor, "CurrentValue"
                  humidityActual-> the room's HumiditySensor, "CurrentValue" (both %RH, no scaling)
                  tempTarget    -> the SPACE itself, "thermalRequirements.spaceTemperature"
              - InfoOnlyAnalog standalone sensors (sourceAttributePath "value"), by control name:
                  name ~ temperatur/temp -> TemperatureSensor "CurrentValue"
                  name ~ feuchte/humid   -> HumiditySensor "CurrentValue"
                  name ~ co2             -> CO2Sensor "CurrentValue"
                  name ~ helligkeit/lux/illumin -> IlluminanceSensor "CurrentValue"
              - PresenceDetector (sourceAttributePath "active") -> PresenceSensor "CurrentValue"
              - Dimmer in a "lights" category (sourceAttributePath "position", already 0-100 %)
                -> the room's Luminaire "DimmingLevel"
              - Jalousie (sourceAttributePath "position", 0..1) -> the room's ShadingDevice
                "Position", expression "value * 100"
              If a matched room has no sensor/element entity of the required type, OMIT that mapping.

              STEP 3 — BUILDING ENERGY MAPPINGS (match Loxone energy control NAME -> EnergyIQ energy
              entity, target that entity's rtId). All Loxone energy values are ALREADY in kW (power)
              and kWh (energy) — DO NOT scale. Loxone Meter states: actual (kW), total (kWh import),
              totalNeg (kWh export). EnergyManager2 states: Gpwr (grid kW), Ppwr (PV kW), Spwr (storage
              kW, SIGNED: >0 charging / <0 discharging), Ssoc (SOC %).
              - EnergyManager2 (e.g. "Energiemanager"):
                  Gpwr -> GridConnection (the main one, e.g. "Hausanschluss"), "ActivePower"
                  Ppwr -> PhotovoltaicSystem, "TotalCurrentPower"
                  Spwr -> BatteryStorage, emit FOUR separate mapping entries:
                     "ChargingPower"    expression "value > 0 ? value : 0"
                     "DischargingPower" expression "value < 0 ? 0 - value : 0"
                     "IsCharging"       expression "value > 0"
                     "IsDischarging"    expression "value < 0"
                  Ssoc -> BatteryStorage, "StateOfCharge"
              - Loxone Meter "Verbrauch X" -> the matching EnergyIQ/Meter (by name, e.g. "Stromzähler …"):
                  actual -> "ActivePower", total -> "ImportedEnergy"
              - Loxone Wallbox2 -> the matching EnergyIQ/ChargingStation:
                  actual -> "ActivePower", total -> "ImportedEnergy"

              SourceAttributePath is ALWAYS the real Loxone STATE name — the runtime filters
              mappings by the state name of each incoming event: tempActual, co2, humidityActual,
              tempTarget, Gpwr, Ppwr, Spwr, Ssoc, actual, total; InfoOnlyAnalog -> "value",
              PresenceDetector -> "active", Dimmer/Jalousie -> "position". NEVER use
              "CurrentValue" as sourceAttributePath — no state event carries that name.

              MAPPING NAME — deterministic and UNIQUE (the pipeline GetOrCreate-matches by name, so a
              stable name keeps re-runs idempotent; multiple targets from one state MUST differ):
              use exactly "<controlName>|<stateName>|<targetAttribute>" (e.g.
              "Energiemanager|Spwr|IsCharging", "Temp Wohnbereich|tempActual|CurrentValue").

              CRITICAL — RtId RULES (violating these crashes the pipeline):
              - controlRtId and targetRtId MUST be copied EXACTLY from tool results — each is a
                24-char hex string (e.g. "67f0c00ec4ff02221e0b7001"). Never invent, shorten, or use
                non-hex values.
              - If you cannot resolve a control rtId or a target entity rtId, OMIT that entry.
              - Do NOT query existing DataPointMappings (idempotency is handled downstream); it wastes
                tool rounds.

              OUTPUT FORMAT — the response is MACHINE-PARSED; violating this crashes the pipeline:
              - Your final message must contain NOTHING but the complete JSON array wrapped in a
                ```json fence. No analysis, no summaries, no room-match lists, no text before or
                after the fence. Every character of prose eats output tokens and has caused the
                array to be cut off mid-stream in past runs.
              - Do any reasoning in the messages where you call tools — NEVER in the final message.
              - COMPACT JSON: no indentation, no spaces after ':' or ','. One entry per line is OK.
              - Emit EXACTLY these fields per entry: name, controlRtId, controlCkTypeId,
                targetRtId, targetCkTypeId, sourceAttributePath, targetAttributePath,
                mappingExpression (empty string if none). Do NOT emit reason, confidence,
                or any other field — they are discarded and only waste output tokens.
              Be thorough: cover every control you can resolve.
            question: |-
              Query the Loxone controls and the EnergyIQ v2 entities via the MCP tools, then match
              them and return the DataPointMapping entries as a JSON array.
            jsonFormatSample: |-
              ```json
              [{"name":"Temp Wohnbereich|tempActual|CurrentValue","controlRtId":"67f0c00ec4ff02221e0b7001","controlCkTypeId":"Loxone/Control","targetRtId":"6789a00000000000010000a1","targetCkTypeId":"EnergyIQ/TemperatureSensor","sourceAttributePath":"tempActual","targetAttributePath":"CurrentValue","mappingExpression":""},
              {"name":"Energiemanager|Spwr|IsDischarging","controlRtId":"6a42ba7da65fa6e13110a4cf","controlCkTypeId":"Loxone/Control","targetRtId":"6789a00000000000000087d1","targetCkTypeId":"EnergyIQ/BatteryStorage","sourceAttributePath":"Spwr","targetAttributePath":"IsDischarging","mappingExpression":"value < 0"}]
              ```
            targetPath: $.mappingSuggestions
            includeRawResponse: true
            rawResponseOutputPath: $.rawAiResponse
            continueOnError: false

          # ── Step 3: Create DataPointMapping entities from AI suggestions ──

          # ── Step 3: Create entities + associations ──
          # GetOrCreateRtEntitiesByType pre-allocates RtIds so associations can reference them
          - type: ForEach@1
            description: Create DataPointMapping entities and associations
            iterationPath: $.mappingSuggestions
            targetPath: $.mappingResults
            mergePath: $.updates
            transformations:
              # Validate controlRtId is a 24-char hex string (real ObjectId), not an
              # AI-hallucinated value. Skip entries with invalid RtId format.
              - type: If@1
                description: Skip entries without valid 24-char hex controlRtId
                path: $.key.controlRtId
                operator: RegexMatch
                value: "^[0-9a-fA-F]{24}$"
                valueType: String
                transformations:
                  # Pre-allocate RtId via GetOrCreate (matches by Name to be idempotent)
                  - type: GetOrCreateRtEntitiesByType@1
                    description: Get or create DataPointMapping by Name
                    ckTypeId: System.Communication/DataPointMapping
                    rtIdTargetPath: $.updates._mappingRtId
                    ckTypeIdTargetPath: $.updates._mappingCkTypeId
                    modOperationPath: $.updates._mappingModOp
                    fieldFilters:
                      - attributePath: Name
                        operator: Equals
                        comparisonValuePath: $.key.name
                  - type: CreateUpdateInfo@1
                    description: Create or update DataPointMapping entity
                    targetPath: $.updates._mappingUpdate
                    updateKindPath: $.updates._mappingModOp
                    ckTypeIdPath: $.updates._mappingCkTypeId
                    rtIdPath: $.updates._mappingRtId
                    attributeUpdates:
                      - attributeName: Name
                        attributeValueType: String
                        valuePath: $.key.name
                      - attributeName: Enabled
                        attributeValueType: Boolean
                        value: true
                      - attributeName: SourceAttributePath
                        attributeValueType: String
                        valuePath: $.key.sourceAttributePath
                      - attributeName: TargetAttributePath
                        attributeValueType: String
                        valuePath: $.key.targetAttributePath
                      - attributeName: MappingExpression
                        attributeValueType: String
                        valuePath: $.key.mappingExpression
                  # MapsFrom: DataPointMapping → source Loxone Control (only for new entities)
                  - type: If@1
                    description: Create associations only for new entities
                    path: $.updates._mappingModOp
                    operator: Equals
                    value: 0
                    valueType: Int
                    transformations:
                      - type: CreateAssociationUpdate@1
                        targetPath: $.updates._assocUpdateItems
                        targetValueKind: Array
                        targetValueWriteMode: Append
                        updateKind: CREATE
                        originRtIdPath: $.updates._mappingUpdate.RtId
                        originCkTypeIdPath: $.updates._mappingUpdate.CkTypeId
                        targetRtIdPath: $.key.controlRtId
                        targetCkTypeId: Loxone/Control
                        associationRoleId: System.Communication/MapsFrom
                      # MapsTo: DataPointMapping → target EnergyIQ entity (Sensor / Luminaire /
                      # ShadingDevice / Space / energy entity — the AI returns its rtId in targetRtId).
                      - type: CreateAssociationUpdate@1
                        targetPath: $.updates._assocUpdateItems
                        targetValueKind: Array
                        targetValueWriteMode: Append
                        updateKind: CREATE
                        originRtIdPath: $.updates._mappingUpdate.RtId
                        originCkTypeIdPath: $.updates._mappingUpdate.CkTypeId
                        targetRtIdPath: $.key.targetRtId
                        targetCkTypeIdPath: $.key.targetCkTypeId
                        associationRoleId: System.Communication/MapsTo

          # ── Step 4: Persist all entities and associations ──
          - type: Flatten@1
            path: $.mappingResults[*]._mappingUpdate
            targetPath: $._updateItems
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          - type: Flatten@1
            path: $.mappingResults[*]._assocUpdateItems[*]
            targetPath: $._assocUpdateItems
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          - type: If@1
            description: Only apply if there are mappings to create
            path: $._updateItems[0].RtId
            operator: NotEquals
            value: null
            valueType: String
            transformations:
              - type: ApplyChanges@2
                entityUpdatesPath: $._updateItems
                associationUpdatesPath: $._assocUpdateItems
          # Store result summary for visualization
          - type: SetPipelineExecutionResult@1
            description: Store mapping result
            path: $.rawAiResponse

  # ==========================================================================
  # Pipeline: Rules-based Auto-Map (deterministic alternative to the AI pipeline)
  #
  # Uses GenerateDataPointMappings@1 — a Mesh node that:
  #   1. Loads Loxone/Room + EnergyIQ/Space entities directly from the repository.
  #   2. Matches rooms to spaces by an ordered list of strategies (Exact → Normalized → Regex → Manual).
  #   3. Walks each matched Room → Category → Control via System/ParentChild.
  #   4. Evaluates the controlMappingRules below against every (control, state) pair.
  #
  # The output is the same suggestion array shape as AnthropicAiQuery@1, so the
  # existing GetOrCreate/CreateUpdateInfo/CreateAssociationUpdate ForEach is reused
  # verbatim. The mapping Name is deterministic ({ruleId}|{controlRtId}|{stateName})
  # which keeps re-runs idempotent — the same control/state always reuses the same
  # DataPointMapping entity.
  #
  # Compared to the AI pipeline (67f0b00ec4ff02221e0b600b):
  #   + No LLM ⇒ no token limits, no incomplete coverage, no RtId hallucination.
  #   + Same rules across every room ⇒ no uneven detail levels.
  #   + Reviewable / versionable: rules live in this YAML, diffs show up in PR.
  #   − Pure name-based matching: anything fuzzier than NormalizedName needs an
  #     explicit Manual override (kept under containerMatchingStrategies).
  # ==========================================================================
  # Re-enabled for EnergyIQ-2.0.0 with v2-aware mapping rules.
  # GenerateDataPointMappings@1 was extended with `childTargetCkTypeId` and
  # `childTargetAssociationRoleId` on the Map block — rules can now navigate from
  # the matched container target (Space) to a child entity (e.g. TemperatureSensor
  # via SpaceSensors) before emitting the suggestion. Rules without those fields
  # target the container directly (v1-compatible).
  - rtId: 67f0b00ec4ff02221e0b600c
    ckTypeId: System.Communication/Pipeline
    associations:
    - roleId: System/ParentChild
      targetRtId: 67f0b00ec4ff02221e0b600a
      targetCkTypeId: System.Communication/DataFlow
    - roleId: System.Communication/Executes
      targetRtId: "670000000000000000000002"
      targetCkTypeId: System.Communication/Adapter
    attributes:
    - id: System/Name
      value: Rules-based Auto-Map
    - id: System/Description
      value: Deterministically generates DataPointMappings from declarative rules. v2-aware — rules with `childTargetCkTypeId` map to Sensor/Actuator entities inside the matched Space.
    - id: System/Enabled
      value: true
    - id: System.Communication/PipelineDefinition
      value: |-
        triggers:
          - type: FromExecutePipelineCommand@1
        transformations:
          # ── Step 1: Rules-driven mapping suggestion generation ──
          - type: GenerateDataPointMappings@1
            description: Generate DataPointMapping suggestions from rules
            sourceContainerCkTypeId: Loxone/Room
            sourceControlCkTypeId: Loxone/Control
            sourceCategoryCkTypeId: Loxone/Category
            targetCkTypeId: EnergyIQ/Space
            hierarchyAssociationRoleId: System/ParentChild
            statesAttribute: States
            stateNameAttribute: Name
            defaultSourceAttributePath: CurrentValue
            targetPath: $.mappingSuggestions
            statisticsTargetPath: $.mappingStatistics
            containerMatchingStrategies:
              # 1) Exact case-sensitive name match: "Wohnzimmer" == "Wohnzimmer"
              - kind: ExactName
                sourceAttribute: Name
                targetAttribute: Name
              # 2) Normalized name: lowercased, trimmed, diacritics + whitespace + punctuation stripped.
              #    Catches "Küche EG" ↔ "kueche eg", "Büro 1.OG" ↔ "buero1og", etc.
              - kind: NormalizedName
                sourceAttribute: Name
                targetAttribute: Name
              # 3) Regex fallback: if room names embed a room number like "OG.01 Büro Direktor",
              #    extract the "OG.01" prefix and match against Space.RoomNumber.
              - kind: Regex
                sourceAttribute: Name
                targetAttribute: RoomNumber
                pattern: "^([A-Za-z]{1,3}\\.\\d+)"
                captureGroup: 1
              # 4) Manual overrides — Loxone room names that no name-based strategy can
              #    resolve onto a BIM Space (occupant-based room names vs. functional space
              #    names). Space rtIds are the fixed seed ids from data/bim/rt-firmianstrasse.yaml,
              #    so these overrides are valid on every tenant initialised from this repo.
              #    DG 1 (12 m²) is the two-person office (Gerry/Reimar), DG 2 (10 m²) Sebastian's.
              - kind: Manual
                sourceAttribute: Name
                overrides:
                  - source: "Büro Marlene"
                    targetRtId: "6789a00000000000000012d2" # Büro EG
                  - source: "Büro Gerry/Reimar DG"
                    targetRtId: "6789a00000000000000032df" # Büro DG 1
                  - source: "Büro Sebastian DG"
                    targetRtId: "6789a00000000000000033e0" # Büro DG 2
                  - source: "Aufenthaltsraum DG"
                    targetRtId: "6789a00000000000000031de" # Aufenthaltsraum
                  - source: "Schlafzimmer Patrick"
                    targetRtId: "6789a00000000000000023da" # Kinderzimmer
                  - source: "Flur EG"
                    targetRtId: "6789a00000000000000016d6" # Vorraum
            controlMappingRules:
              # ── IRoomControllerV2 — multi-state Loxone room controller ──
              # Each state targets the matching sensor entity inside the Space.
              # If no such sensor exists in the room, the rule is silently skipped.
              # NOTE: targetAttribute is resolved by attribute NAME, not id. All v2 sensor
              # types rename their typed value attribute (id Temperature/Humidity/CO2Level/…)
              # to the uniform NAME "CurrentValue" — mappings must use CurrentValue.
              - id: roomController-tempActual
                when: { controlType: IRoomControllerV2, stateName: tempActual }
                map:
                  targetAttribute: CurrentValue
                  childTargetCkTypeId: EnergyIQ/TemperatureSensor
                  childTargetAssociationRoleId: EnergyIQ/SpaceSensors
              - id: roomController-co2
                when: { controlType: IRoomControllerV2, stateName: co2 }
                map:
                  targetAttribute: CurrentValue
                  childTargetCkTypeId: EnergyIQ/CO2Sensor
                  childTargetAssociationRoleId: EnergyIQ/SpaceSensors
              # humidityActual is already %RH (0-100) and HumiditySensor.CurrentValue is %RH
              # too — no scaling (the old "value / 100" stems from the v1 Space.Humidity fraction).
              - id: roomController-humidity
                when: { controlType: IRoomControllerV2, stateName: humidityActual }
                map:
                  targetAttribute: CurrentValue
                  childTargetCkTypeId: EnergyIQ/HumiditySensor
                  childTargetAssociationRoleId: EnergyIQ/SpaceSensors
              # tempTarget — heating setpoint. In v2 this is the Pset_ThermalRequirements
              # record on the Space (design target), not a sensor measurement. Keep this
              # rule pointed at the Space; the DataPointMapping will update the record
              # field. The path uses the attribute NAME ("ThermalRequirements", not the
              # attribute id "ThermalRequirementsRecord") + record slot — RtPathEvaluator
              # resolves segments by name, same as the query columns.
              - id: roomController-tempTarget
                when: { controlType: IRoomControllerV2, stateName: tempTarget }
                map:  { targetAttribute: thermalRequirements.spaceTemperature }

              # ── Standalone InfoOnlyAnalog sensors by naming ──
              # Match Loxone sensor name → corresponding v2 Sensor entity in the Space.
              # NOTE: stateName must be the REAL Loxone state name ("value" for InfoOnlyAnalog,
              # "active" for PresenceDetector, "position" for Dimmer/Jalousie). The WebSocket
              # path (pipeline 6008) filters mappings by state name — a mapping generated with
              # the defaultSourceAttributePath "CurrentValue" never matches any state event.
              # Negative lookahead guards against plant/DHW/outdoor temperature readouts that
              # live in the same Loxone room as a Space's TemperatureSensor: without it, every
              # "…Temperatur…" InfoOnlyAnalog in the Technikraum (Sole Vor-/Rücklauf, Heißgas,
              # Warmwasser IST, Raumtemperatur Verschiebung, Außen…) was mapped onto
              # Temp-Technik.CurrentValue (7 bogus mappings, last-write-wins garbage).
              # Outdoor temperature is mapped explicitly via the "outdoor-temp"/"kwl-outdoor-temp"
              # directControlMappings instead.
              - id: infoonly-temperature-by-name
                when:
                  controlType: InfoOnlyAnalog
                  controlNameRegex: "(?i)^(?!.*(sole|heißgas|heissgas|warmwasser|vorlauf|rücklauf|ruecklauf|verschiebung|außen|aussen)).*(temperatur|temp(?!late))"
                  stateName: value
                map:
                  targetAttribute: CurrentValue
                  childTargetCkTypeId: EnergyIQ/TemperatureSensor
                  childTargetAssociationRoleId: EnergyIQ/SpaceSensors
              - id: infoonly-humidity-by-name
                when:
                  controlType: InfoOnlyAnalog
                  controlNameRegex: "(?i)(feuchte|humid)"
                  stateName: value
                map:
                  targetAttribute: CurrentValue
                  childTargetCkTypeId: EnergyIQ/HumiditySensor
                  childTargetAssociationRoleId: EnergyIQ/SpaceSensors
              - id: infoonly-co2-by-name
                when:
                  controlType: InfoOnlyAnalog
                  controlNameRegex: "(?i)co2"
                  stateName: value
                map:
                  targetAttribute: CurrentValue
                  childTargetCkTypeId: EnergyIQ/CO2Sensor
                  childTargetAssociationRoleId: EnergyIQ/SpaceSensors
              - id: infoonly-illuminance-by-name
                when:
                  controlType: InfoOnlyAnalog
                  controlNameRegex: "(?i)(helligkeit|lux|illumin)"
                  stateName: value
                map:
                  targetAttribute: CurrentValue
                  childTargetCkTypeId: EnergyIQ/IlluminanceSensor
                  childTargetAssociationRoleId: EnergyIQ/SpaceSensors

              # ── Presence ──
              # Loxone PresenceDetector: value state is "active" (0/1); the typed
              # Evaluate cast lands it as a real Boolean on PresenceSensor.CurrentValue.
              - id: presence-detector
                when: { controlType: PresenceDetector, stateName: active }
                map:
                  targetAttribute: CurrentValue
                  childTargetCkTypeId: EnergyIQ/PresenceSensor
                  childTargetAssociationRoleId: EnergyIQ/SpaceSensors

              # ── Lighting (Luminaire keeps internal DimmingLevel — no child navigation) ──
              # A Dimmer in a "lights" category drives a Luminaire's DimmingLevel directly;
              # the dimmer-as-separate-actuator pattern (Dimmer entity via SpaceActuators)
              # is not yet exercised by the demo data, so keep the rule space-targeted.
              # Loxone Dimmer "position" is already 0-100 %, DimmingLevel is % → no scaling.
              - id: dimmer-lighting
                when:
                  controlType: Dimmer
                  categoryType: lights
                  stateName: position
                map:
                  targetAttribute: DimmingLevel
                  childTargetCkTypeId: EnergyIQ/Luminaire
                  childTargetAssociationRoleId: EnergyIQ/SpaceElements

              # ── Shading ──
              # Loxone Jalousie "position" is 0..1 (1 = fully closed); ShadingDevice.Position
              # is 0-100 % → scale up.
              - id: jalousie-shading
                when: { controlType: Jalousie, stateName: position }
                map:
                  targetAttribute: Position
                  expression: "value * 100"
                  childTargetCkTypeId: EnergyIQ/ShadingDevice
                  childTargetAssociationRoleId: EnergyIQ/SpaceElements

              # ── Lighting status (room level) ──
              # LightControllerV2 exposes NO controller-level dimming value; the active
              # scene arrives as activeMoodsNum (mood id, 778 = the fixed Loxone "Off"
              # mood) → IsOn = activeMoodsNum <> 778 (mXparser inequality is <>, not !=).
              # Per-circuit switches/dimmers are SubControls, which neither the rules
              # walker nor pipeline 6008 (GetRtEntitiesByType Loxone/Control) resolves —
              # per-circuit DimmingLevel needs SubControl support in the engine first.
              - id: lightcontroller-ison
                when: { controlType: LightControllerV2, stateName: activeMoodsNum }
                map:
                  targetAttribute: IsOn
                  expression: "value <> 778"
                  childTargetCkTypeId: EnergyIQ/Luminaire
                  childTargetAssociationRoleId: EnergyIQ/SpaceElements

              # ── Energy meters → see directControlMappings below ──
              # Energy data points (grid, PV, battery, sub-meters, wallboxes) are building-/area-
              # level, not room-scoped, so they are NOT room-matched here. They use the direct
              # control-name → entity-name mappings below instead.

            # ── Direct (non-container) energy mappings: Loxone control Name → EnergyIQ entity Name ──
            # NOTE: the control/entity Name pairs below assume the Firmianstraße Miniserver + the
            # rt-firmianstrasse EnergyIQ Names. Adjust if the real Names differ. Units are verified
            # against the Miniserver structure (LoxAPP3 actualFormat="%.3fkW", totalFormat="%.1fkWh"):
            # Loxone Meter states actual (kW power), total (kWh import), totalNeg (kWh export,
            # bidirectional only). EnergyManager2 states Gpwr (grid kW), Ppwr (PV kW), Spwr (storage
            # power kW, signed: >0 charging / <0 discharging), Ssoc (storage SOC %). All already in
            # kW/kWh and the EnergyIQ model expects kW/kWh, so no scaling expression is needed.
            directControlMappings:
              # ── Whole-house Grid / PV / Battery from the single EnergyManager2 ──
              - id: em-grid
                controlType: EnergyManager2
                controlName: Energiemanager
                targetCkTypeId: EnergyIQ/GridConnection
                targetName: Hausanschluss
                states:
                  - { stateName: Gpwr, targetAttribute: ActivePower }
              - id: em-pv
                controlType: EnergyManager2
                controlName: Energiemanager
                targetCkTypeId: EnergyIQ/PhotovoltaicSystem
                targetName: "PV-Anlage Firmianstraße"
                states:
                  - { stateName: Ppwr, targetAttribute: TotalCurrentPower }
              # Battery: derive all four runtime attributes from the single signed EnergyManager2
              # storage power (Spwr). Loxone Firmianstraße convention: Spwr > 0 = discharging,
              # Spwr < 0 = charging, Spwr == 0 = idle (live-verified 2026-07-05: evening without PV,
              # Spwr ~ +1.1 kW while Ssoc fell 46 → 45). ChargingPower/DischargingPower are the two
              # positive-valued power attributes; IsCharging/IsDischarging are the boolean flags
              # (ApplyDataPointMappings casts the formula result to the target attribute's CK type, so
              # a comparison expression like "value > 0" lands as a real bool).
              # Each Spwr target MUST use a distinct `id`: the generated DataPointMapping name is
              # "{id}|{controlRtId}|{stateName}" and does NOT include the target attribute, so multiple
              # Spwr mappings under one id would collide on that name.
              - id: em-battery
                controlType: EnergyManager2
                controlName: Energiemanager
                targetCkTypeId: EnergyIQ/BatteryStorage
                targetName: Batteriespeicher
                states:
                  - { stateName: Spwr, targetAttribute: ChargingPower, expression: "value < 0 ? 0 - value : 0" }
                  - { stateName: Ssoc, targetAttribute: StateOfCharge }
              - id: em-battery-discharge
                controlType: EnergyManager2
                controlName: Energiemanager
                targetCkTypeId: EnergyIQ/BatteryStorage
                targetName: Batteriespeicher
                states:
                  - { stateName: Spwr, targetAttribute: DischargingPower, expression: "value > 0 ? value : 0" }
              - id: em-battery-ischarging
                controlType: EnergyManager2
                controlName: Energiemanager
                targetCkTypeId: EnergyIQ/BatteryStorage
                targetName: Batteriespeicher
                states:
                  - { stateName: Spwr, targetAttribute: IsCharging, expression: "value < 0" }
              - id: em-battery-isdischarging
                controlType: EnergyManager2
                controlName: Energiemanager
                targetCkTypeId: EnergyIQ/BatteryStorage
                targetName: Batteriespeicher
                states:
                  - { stateName: Spwr, targetAttribute: IsDischarging, expression: "value > 0" }
              # ── Per-floor consumption sub-meters (Loxone "Verbrauch X" → EnergyIQ Stromzähler) ──
              - id: meter-eg
                controlType: Meter
                controlName: Verbrauch EG
                targetCkTypeId: EnergyIQ/Meter
                targetName: Stromzähler HG-EG
                states:
                  - { stateName: actual, targetAttribute: ActivePower }
                  - { stateName: total, targetAttribute: ImportedEnergy }
              - id: meter-og
                controlType: Meter
                controlName: Verbrauch OG
                targetCkTypeId: EnergyIQ/Meter
                targetName: Stromzähler HG-1.OG
                states:
                  - { stateName: actual, targetAttribute: ActivePower }
                  - { stateName: total, targetAttribute: ImportedEnergy }
              - id: meter-dg
                controlType: Meter
                controlName: Verbrauch DG
                targetCkTypeId: EnergyIQ/Meter
                targetName: Stromzähler HG-DG
                states:
                  - { stateName: actual, targetAttribute: ActivePower }
                  - { stateName: total, targetAttribute: ImportedEnergy }
              # ── EV wallboxes (Loxone Wallbox2 → EnergyIQ ChargingStation) ──
              - id: wallbox-garage
                controlType: Wallbox2
                controlName: Garage Ladestation
                targetCkTypeId: EnergyIQ/ChargingStation
                targetName: Wallbox-Links
                states:
                  - { stateName: actual, targetAttribute: ActivePower }
                  - { stateName: total, targetAttribute: ImportedEnergy }
              - id: wallbox-parkplatz
                controlType: Wallbox2
                controlName: Parkplatz Ladestation
                targetCkTypeId: EnergyIQ/ChargingStation
                targetName: Wallbox-Rechts
                states:
                  - { stateName: actual, targetAttribute: ActivePower }
                  - { stateName: total, targetAttribute: ImportedEnergy }
              # ── Outdoor weather (Loxone InfoOnlyAnalog → ExternalSpace sensors + KWL) ──
              # "Außen Temperatur" (17b3c833…) ticks live; the similarly named "Außentemperatur"
              # (15d991b9…) has never delivered a state update, so it is deliberately NOT used.
              - id: outdoor-temp
                controlType: InfoOnlyAnalog
                controlName: Außen Temperatur
                targetCkTypeId: EnergyIQ/TemperatureSensor
                targetName: Außentemperatur
                states:
                  - { stateName: value, targetAttribute: CurrentValue }
              - id: outdoor-humidity
                controlType: InfoOnlyAnalog
                controlName: Außenluftfeuchtigkeit
                targetCkTypeId: EnergyIQ/HumiditySensor
                targetName: Außenluftfeuchtigkeit
                states:
                  - { stateName: value, targetAttribute: CurrentValue }
              # KWL intake air temperature → AHU.OutdoorAirTemp (device-level reading,
              # distinct from the free-field ExternalSpace sensor above).
              - id: kwl-outdoor-temp
                controlType: InfoOnlyAnalog
                controlName: Außenlufttemperatur (AZ30-BT23)
                targetCkTypeId: EnergyIQ/AirHandlingUnit
                targetName: Kontrollierte Wohnraumlüftung
                states:
                  - { stateName: value, targetAttribute: OutdoorAirTemp }
              # ── Heat pump hydraulics (NIBE readouts via Loxone InfoOnlyAnalog) ──
              # BT2/BT3 = heating-circuit supply/return; Sole VL/RL = brine (source) in/out
              # (NIBE BT10/BT11). Since EnergyIQ 2.9.0 also: Heißgas → HotGasTemp, BT25/SOLL →
              # CoolingSupplyTemp/-Setpoint, Heizkurve/Raumtemp-Verschiebung → HeatingCurve/-Offset.
              # NOT mapped on purpose: Kompressorstatus/Betriebsmodus (numeric Loxone codes with
              # no verified enum translation), "Verschiebung Heizkurve" (ValueSelector = operator
              # INPUT control, not a readout; the readout is "Raumtemperatur Verschiebung").
              - id: hp-supply-temp
                controlType: InfoOnlyAnalog
                controlName: Vorlauf IST (BT2)
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: value, targetAttribute: SupplyTemp }
              - id: hp-return-temp
                controlType: InfoOnlyAnalog
                controlName: Rücklauf (BT3)
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: value, targetAttribute: ReturnTemp }
              - id: hp-source-inlet
                controlType: InfoOnlyAnalog
                controlName: Sole Vorlauf Temperatur
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: value, targetAttribute: SourceInletTemp }
              - id: hp-source-outlet
                controlType: InfoOnlyAnalog
                controlName: Sole Rücklauf Temperatur
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: value, targetAttribute: SourceOutletTemp }
              - id: hp-hotgas
                controlType: InfoOnlyAnalog
                controlName: Heißgas Temperatur
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: value, targetAttribute: HotGasTemp }
              - id: hp-cooling-supply
                controlType: InfoOnlyAnalog
                controlName: "Vorlauf, Kühlung IST (BT25)"
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: value, targetAttribute: CoolingSupplyTemp }
              - id: hp-cooling-supply-setpoint
                controlType: InfoOnlyAnalog
                controlName: "Vorlauf, Kühlung SOLL"
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: value, targetAttribute: CoolingSupplyTempSetpoint }
              - id: hp-heating-curve
                controlType: InfoOnlyAnalog
                controlName: Heizkurve
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: value, targetAttribute: HeatingCurve }
              - id: hp-curve-offset
                controlType: InfoOnlyAnalog
                controlName: Raumtemperatur Verschiebung
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: value, targetAttribute: HeatingCurveOffset }
              # DHW tank temperature → the dedicated Warmwasserspeicher entity (NOT the
              # 500 l heating buffer — different vessel).
              - id: hp-dhw-temp
                controlType: InfoOnlyAnalog
                controlName: Warmwasser Temperatur IST
                targetCkTypeId: EnergyIQ/ThermalEnergyStorage
                targetName: Warmwasserspeicher
                states:
                  - { stateName: value, targetAttribute: StorageTempTop }
              # ── KWL air temperatures (NIBE AZ30 module) ──
              # BT22 Zuluft → SupplyAirTemp, BT20 Abluft → ReturnAirTemp, BT21 Fortluft →
              # ExhaustAirTemp (EnergyIQ 2.9.0). Units per LoxAPP3 formats: °C, no scaling.
              - id: kwl-supply-air
                controlType: InfoOnlyAnalog
                controlName: Räume Zuluft (AZ30-BT22)
                targetCkTypeId: EnergyIQ/AirHandlingUnit
                targetName: Kontrollierte Wohnraumlüftung
                states:
                  - { stateName: value, targetAttribute: SupplyAirTemp }
              - id: kwl-return-air
                controlType: InfoOnlyAnalog
                controlName: Räume Abluft (AZ30-BT20)
                targetCkTypeId: EnergyIQ/AirHandlingUnit
                targetName: Kontrollierte Wohnraumlüftung
                states:
                  - { stateName: value, targetAttribute: ReturnAirTemp }
              - id: kwl-exhaust-air
                controlType: InfoOnlyAnalog
                controlName: Fortluft (AZ30-BT21)
                targetCkTypeId: EnergyIQ/AirHandlingUnit
                targetName: Kontrollierte Wohnraumlüftung
                states:
                  - { stateName: value, targetAttribute: ExhaustAirTemp }
              # ── Heating-medium pump (NIBE GP1 / flow meter BF1) ──
              # GP1 reports the ACTUAL speed in % → Pump.Speed (EnergyIQ 2.9.0).
              # BF1 reports l/min (LoxAPP3 format "%.1f l/m"); FlowRate expects m³/h → × 0.06.
              - id: pump-speed
                controlType: InfoOnlyAnalog
                controlName: Drehzahl der Heizungsmediumpumpe (GP1)
                targetCkTypeId: EnergyIQ/Pump
                targetName: Heizkreispumpe
                states:
                  - { stateName: value, targetAttribute: Speed }
              - id: pump-flow
                controlType: InfoOnlyAnalog
                controlName: Volumenstrommesser (BF1)
                targetCkTypeId: EnergyIQ/Pump
                targetName: Heizkreispumpe
                states:
                  - { stateName: value, targetAttribute: FlowRate, expression: "value * 0.06" }
              # ── Technikraum consumer sub-meters (Loxone Meter controls, kW/kWh) ──
              - id: meter-it-schrank
                controlType: Meter
                controlName: Verbrauch IT Schrank
                targetCkTypeId: EnergyIQ/Meter
                targetName: Stromzähler IT-Schrank
                states:
                  - { stateName: actual, targetAttribute: ActivePower }
                  - { stateName: total, targetAttribute: ImportedEnergy }
              - id: meter-technikraum
                controlType: Meter
                controlName: Verbrauch Technikraum
                targetCkTypeId: EnergyIQ/Meter
                targetName: Stromzähler Technikraum
                states:
                  - { stateName: actual, targetAttribute: ActivePower }
                  - { stateName: total, targetAttribute: ImportedEnergy }
              - id: meter-waermepumpe
                controlType: Meter
                controlName: Verbrauch Wärmepumpe
                targetCkTypeId: EnergyIQ/Meter
                targetName: Stromzähler Wärmepumpe
                states:
                  - { stateName: actual, targetAttribute: ActivePower }
                  - { stateName: total, targetAttribute: ImportedEnergy }
              # Same meter also feeds the heat pump's own PowerConsumption (kW) —
              # distinct id, so the generated mapping name does not collide.
              - id: hp-power
                controlType: Meter
                controlName: Verbrauch Wärmepumpe
                targetCkTypeId: EnergyIQ/HeatPump
                targetName: Wärmepumpe
                states:
                  - { stateName: actual, targetAttribute: PowerConsumption }
              # NOT mapped (no clean 1:1 Loxone source): NG-EG meter, and the appliances
              # (Loxone has a single combined "Verbrauch Waschmaschine Trockner" meter).

          # ── Step 2: Persist suggestions as DataPointMapping entities + associations ──
          # Identical logic to the AI pipeline below — by design, so behaviour stays in sync.
          - type: ForEach@1
            description: Create DataPointMapping entities and associations
            iterationPath: $.mappingSuggestions
            targetPath: $.mappingResults
            mergePath: $.updates
            transformations:
              # Pre-allocate RtId via GetOrCreate (matches by deterministic Name → idempotent)
              - type: GetOrCreateRtEntitiesByType@1
                description: Get or create DataPointMapping by Name
                ckTypeId: System.Communication/DataPointMapping
                rtIdTargetPath: $.updates._mappingRtId
                ckTypeIdTargetPath: $.updates._mappingCkTypeId
                modOperationPath: $.updates._mappingModOp
                fieldFilters:
                  - attributePath: Name
                    operator: Equals
                    comparisonValuePath: $.key.name
              - type: CreateUpdateInfo@1
                description: Create or update DataPointMapping entity
                targetPath: $.updates._mappingUpdate
                updateKindPath: $.updates._mappingModOp
                ckTypeIdPath: $.updates._mappingCkTypeId
                rtIdPath: $.updates._mappingRtId
                attributeUpdates:
                  - attributeName: Name
                    attributeValueType: String
                    valuePath: $.key.name
                  - attributeName: Enabled
                    attributeValueType: Boolean
                    value: true
                  - attributeName: SourceAttributePath
                    attributeValueType: String
                    valuePath: $.key.sourceAttributePath
                  - attributeName: TargetAttributePath
                    attributeValueType: String
                    valuePath: $.key.targetAttributePath
                  - attributeName: MappingExpression
                    attributeValueType: String
                    valuePath: $.key.mappingExpression
              # MapsFrom / MapsTo only on insert, to keep re-runs idempotent.
              - type: If@1
                description: Create associations only for new entities
                path: $.updates._mappingModOp
                operator: Equals
                value: 0
                valueType: Int
                transformations:
                  - type: CreateAssociationUpdate@1
                    targetPath: $.updates._assocUpdateItems
                    targetValueKind: Array
                    targetValueWriteMode: Append
                    updateKind: CREATE
                    originRtIdPath: $.updates._mappingUpdate.RtId
                    originCkTypeIdPath: $.updates._mappingUpdate.CkTypeId
                    targetRtIdPath: $.key.controlRtId
                    targetCkTypeId: Loxone/Control
                    associationRoleId: System.Communication/MapsFrom
                  - type: CreateAssociationUpdate@1
                    targetPath: $.updates._assocUpdateItems
                    targetValueKind: Array
                    targetValueWriteMode: Append
                    updateKind: CREATE
                    originRtIdPath: $.updates._mappingUpdate.RtId
                    originCkTypeIdPath: $.updates._mappingUpdate.CkTypeId
                    targetRtIdPath: $.key.spaceRtId
                    targetCkTypeIdPath: $.key.spaceCkTypeId
                    associationRoleId: System.Communication/MapsTo

          # ── Step 3: Persist ──
          - type: Flatten@1
            path: $.mappingResults[*]._mappingUpdate
            targetPath: $._updateItems
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          - type: Flatten@1
            path: $.mappingResults[*]._assocUpdateItems[*]
            targetPath: $._assocUpdateItems
            targetValueKind: Simple
            targetValueWriteMode: Overwrite
          - type: If@1
            description: Only apply if there are mappings to create
            path: $._updateItems[0].RtId
            operator: NotEquals
            value: null
            valueType: String
            transformations:
              - type: ApplyChanges@2
                entityUpdatesPath: $._updateItems
                associationUpdatesPath: $._assocUpdateItems
          - type: SetPipelineExecutionResult@1
            description: Store mapping statistics (matched/unmatched rooms, rule hits)
            path: $.mappingStatistics

  # ==========================================================================
  # Data Flow: Validate Coverage
  # Walks the EnergyIQ tree (Site → Building → BuildingStorey → Space) and
  # reports for every Space whether the required DataPointMappings exist
  # (Temperature, CO2Level, Humidity) and which recommended attributes are
  # missing. Output is consumed by the Studio's Mapping Coverage Tree via
  # PipelineExecution.OutputData — the Studio's "Load Report" button reads it
  # to colour-code the tree.
  # ==========================================================================
  - rtId: 67f0b00ec4ff02221e0b600d
    ckTypeId: System.Communication/DataFlow
    attributes:
    - id: System/Name
      value: Validate Coverage
    - id: System/Description
      value: Evaluates DataPointMapping coverage for the EnergyIQ Site tree

  # Re-enabled for EnergyIQ-2.0.0 with `requiredAssociations` rule shape.
  # ValidateDataPointCoverage@1 was extended to additionally check for required
  # child entities via association roles — used here to assert that every Space
  # has a TemperatureSensor / CO2Sensor / HumiditySensor via SpaceSensors.
  - rtId: 67f0b00ec4ff02221e0b600e
    ckTypeId: System.Communication/Pipeline
    associations:
    - roleId: System/ParentChild
      targetRtId: 67f0b00ec4ff02221e0b600d
      targetCkTypeId: System.Communication/DataFlow
    - roleId: System.Communication/Executes
      targetRtId: "670000000000000000000002"
      targetCkTypeId: System.Communication/Adapter
    attributes:
    - id: System/Name
      value: Validate DataPoint Coverage
    - id: System/Description
      value: Reports per-Space coverage status (ok/warning/error) for the EnergyIQ tree. v2-aware — checks for associated Sensor entities and descends into them (SpaceSensors/SpaceActuators/SpaceTerminals) so each device carries its own CurrentValue-mapping status.
    - id: System/Enabled
      value: true
    - id: System.Communication/PipelineDefinition
      value: |-
        triggers:
          - type: FromExecutePipelineCommand@1
        transformations:
          # Walk the EnergyIQ Site → Building → Storey → Space hierarchy
          # via System/ParentChild and evaluate coverage per node. Per-Space
          # coverage is now about associated Sensor entities (v2 — measurements
          # are first-class entities); attribute-based coverage still works for
          # plant equipment that carries its own attributes directly.
          #
          # additionalChildRoleIds descends INTO the device entities attached to
          # each Space (sensors / actuators / terminals), so they become report
          # nodes of their own — the Studio coverage tree shows the same
          # entities via association auto-discovery and colours them from this
          # report. The per-sensor rules assert that every sensor actually has
          # a CurrentValue mapping (the Loxone auto-map rules produce exactly
          # that target path for every sensor subtype).
          - type: ValidateDataPointCoverage@1
            description: Validate EnergyIQ coverage
            rootRtId: 6789a00000000000000000a1
            rootCkTypeId: EnergyIQ/Site
            childRoleId: System/ParentChild
            childCkTypeId: Basic/TreeNode
            additionalChildRoleIds:
              - EnergyIQ/SpaceSensors
              - EnergyIQ/SpaceActuators
              - EnergyIQ/SpaceTerminals
            mappingRoleId: System.Communication/MapsTo
            mappingCkTypeId: System.Communication/DataPointMapping
            maxDepth: 16
            includeDisabledMappings: false
            targetPath: $.report
            rules:
              # Indoor Space: needs Temperature + Humidity + CO2 sensors at minimum;
              # presence/illuminance are recommended.
              - ckTypeId: EnergyIQ/Space
                requiredAssociations:
                  - associationRoleId: EnergyIQ/SpaceSensors
                    targetCkTypeId: EnergyIQ/TemperatureSensor
                  - associationRoleId: EnergyIQ/SpaceSensors
                    targetCkTypeId: EnergyIQ/HumiditySensor
                  - associationRoleId: EnergyIQ/SpaceSensors
                    targetCkTypeId: EnergyIQ/CO2Sensor
              # ExternalSpace: no thermal/lighting requirements, no sensors required.
              - ckTypeId: EnergyIQ/ExternalSpace
              # Per-sensor coverage: every room sensor must be fed by a mapping
              # onto its CurrentValue (rules match the EXACT concrete type).
              - ckTypeId: EnergyIQ/TemperatureSensor
                requiredAttributes: [CurrentValue]
              - ckTypeId: EnergyIQ/HumiditySensor
                requiredAttributes: [CurrentValue]
              - ckTypeId: EnergyIQ/CO2Sensor
                requiredAttributes: [CurrentValue]
              - ckTypeId: EnergyIQ/IlluminanceSensor
                requiredAttributes: [CurrentValue]
              - ckTypeId: EnergyIQ/PresenceSensor
                requiredAttributes: [CurrentValue]
              - ckTypeId: EnergyIQ/WindowContactSensor
                requiredAttributes: [CurrentValue]

          # Persist the report on the PipelineExecution entity so the
          # Studio can fetch it via the latest-execution query.
          - type: SetPipelineExecutionResult@1
            description: Store coverage report for the Studio
            path: $.report
