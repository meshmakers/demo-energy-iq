$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - System.Communication-[3.18,4.0)
  - EnergyIQ-2.0.0

# ============================================================
# EnergyIQ Simulation Data Flows (v2)
# ============================================================
# Simulates sensor data for 6 main rooms, PV system, and HVAC.
# Targets the v2 entity structure: Sensors, Valves, Dampers, HeatPump.
# Polling interval: 10 seconds
# ============================================================

entities:
  # ============================================================
  # SIMULATION INFRASTRUCTURE
  # ============================================================
  # The Pool and Mesh Adapter are auto-provisioned by the System.Communication
  # blueprint (adapter rtId 670000000000000000000002). All pipelines below
  # execute on that adapter; no custom Pool / Simulator Adapter entities needed.

  # DataFlow - Container for pipelines
  - rtId: 6789a00000000000000090a3
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: EnergyIQ Simulation DataFlow
      - id: System/Description
        value: Generates simulated sensor data for rooms, PV, and HVAC

  # ============================================================
  # PIPELINE 1 - Data Generation (Simulation Adapter)
  # ============================================================
  - rtId: 6789a00000000000000090b1
    ckTypeId: System.Communication/Pipeline
    attributes:
      - id: System/Name
        value: Simulation Data Generator
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromPolling@1
              interval: 00:00:10
          transformations:
            - type: Simulation@1
              # locale is required (selects the Faker locale for text generators; harmless for Math.*)
              locale: en
              # Math.Triangle produces a smooth wave in [-amplitude, +amplitude]; its "frequency"
              # is the PERIOD in whole seconds (int). amplitude is fixed at 1 and the LinearScaler
              # blocks below map [-1, 1] onto each target range. (Math.Sinus is unusable for slow
              # cycles here because its frequency is read as an int Hz value -> min 1 Hz.)
              simulations:
                - targetPath: $.tempBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 1200}'
                - targetPath: $.humidityBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 1500}'
                - targetPath: $.co2Base
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 400}'
                - targetPath: $.luxBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 1200}'
                - targetPath: $.pvBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 1200}'
                - targetPath: $.socBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 900}'
                - targetPath: $.valveBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 1000}'
                - targetPath: $.fanBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 600}'
                # ── Energy consumers (each scaled to an ActivePower range below) ──
                - targetPath: $.meterHgEgBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 800}'
                - targetPath: $.meterHgOgBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 1100}'
                - targetPath: $.meterHgDgBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 1300}'
                - targetPath: $.meterNgEgBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 700}'
                - targetPath: $.wallboxLinksBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 1500}'
                - targetPath: $.wallboxRechtsBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 1700}'
                - targetPath: $.applianceWaschmaschineBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 600}'
                - targetPath: $.applianceTrocknerBase
                  simulatorKey: Math.Triangle
                  configuration: '{"amplitude": 1, "frequency": 900}'
            - type: SelectByPath@1
              selectPath:
                - path: "$.tempBase"
                  targetPath: $.temperature
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 18
                      scaleOutputMax: 24
                - path: "$.humidityBase"
                  targetPath: $.humidity
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 35
                      scaleOutputMax: 65
                - path: "$.co2Base"
                  targetPath: $.co2Level
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 500
                      scaleOutputMax: 900
                - path: "$.luxBase"
                  targetPath: $.illuminance
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 100
                      scaleOutputMax: 700
                - path: "$.valveBase"
                  targetPath: $.valvePosition
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 20
                      scaleOutputMax: 70
                - path: "$.valveBase"
                  targetPath: $.damperPosition
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 30
                      scaleOutputMax: 70
                - path: "$.pvBase"
                  targetPath: $.pvStringPower1
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 4.8
                - path: "$.pvBase"
                  targetPath: $.pvStringPower2
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 6.0
                - path: "$.pvBase"
                  targetPath: $.pvStringPower3
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 4.0
                - path: "$.pvBase"
                  targetPath: $.pvStringPower4
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 3.6
                - path: "$.pvBase"
                  targetPath: $.totalPvPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 18.4
                - path: "$.pvBase"
                  targetPath: $.inverterDcPower1
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 10.8
                - path: "$.pvBase"
                  targetPath: $.inverterAcPower1
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 10.4
                - path: "$.pvBase"
                  targetPath: $.inverterDcPower2
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 7.6
                - path: "$.pvBase"
                  targetPath: $.inverterAcPower2
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 7.3
                - path: "$.pvBase"
                  targetPath: $.gridFeedIn
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 12
                - path: "$.pvBase"
                  targetPath: $.selfConsumption
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 2
                      scaleOutputMax: 6
                - path: "$.socBase"
                  targetPath: $.stateOfCharge
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 30
                      scaleOutputMax: 90
                - path: "$.socBase"
                  targetPath: $.chargingPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 5
                - path: "$.tempBase"
                  targetPath: $.hpSupplyTemp
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 28
                      scaleOutputMax: 40
                - path: "$.tempBase"
                  targetPath: $.hpReturnTemp
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 22
                      scaleOutputMax: 32
                - path: "$.valveBase"
                  targetPath: $.hpModulation
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 30
                      scaleOutputMax: 80
                - path: "$.fanBase"
                  targetPath: $.ahuFanSpeed
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 40
                      scaleOutputMax: 80
                - path: "$.tempBase"
                  targetPath: $.ahuSupplyAirTemp
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 18
                      scaleOutputMax: 22
                # ── Energy consumers → ActivePower (kW) ──
                - path: "$.meterHgEgBase"
                  targetPath: $.meterHgEgPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0.3
                      scaleOutputMax: 2.5
                - path: "$.meterHgOgBase"
                  targetPath: $.meterHgOgPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0.2
                      scaleOutputMax: 1.8
                - path: "$.meterHgDgBase"
                  targetPath: $.meterHgDgPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0.1
                      scaleOutputMax: 1.2
                - path: "$.meterNgEgBase"
                  targetPath: $.meterNgEgPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0.1
                      scaleOutputMax: 1.5
                - path: "$.wallboxLinksBase"
                  targetPath: $.wallboxLinksPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 11
                - path: "$.wallboxRechtsBase"
                  targetPath: $.wallboxRechtsPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 7.4
                - path: "$.applianceWaschmaschineBase"
                  targetPath: $.applianceWaschmaschinePower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 2.2
                - path: "$.applianceTrocknerBase"
                  targetPath: $.applianceTrocknerPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: -1
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 2.5
            # ── Closed energy balance ──
            # totalLoad = Σ consumer ActivePower (+ battery charging, which draws from PV/grid)
            # gridActivePower = totalLoad − totalPvPower   (signed: + = import from grid, − = export)
            # By construction: PV + gridImport = load + batteryCharge + gridExport.
            - type: Math@1
              path: $
              itemPath: $.meterHgEgPower
              operation: Add
              value: 0
              itemTargetPath: $.totalLoad
            - type: Math@1
              path: $
              itemPath: $.totalLoad
              operation: Add
              valuePath: $.meterHgOgPower
              itemTargetPath: $.totalLoad
            - type: Math@1
              path: $
              itemPath: $.totalLoad
              operation: Add
              valuePath: $.meterHgDgPower
              itemTargetPath: $.totalLoad
            - type: Math@1
              path: $
              itemPath: $.totalLoad
              operation: Add
              valuePath: $.meterNgEgPower
              itemTargetPath: $.totalLoad
            - type: Math@1
              path: $
              itemPath: $.totalLoad
              operation: Add
              valuePath: $.wallboxLinksPower
              itemTargetPath: $.totalLoad
            - type: Math@1
              path: $
              itemPath: $.totalLoad
              operation: Add
              valuePath: $.wallboxRechtsPower
              itemTargetPath: $.totalLoad
            - type: Math@1
              path: $
              itemPath: $.totalLoad
              operation: Add
              valuePath: $.applianceWaschmaschinePower
              itemTargetPath: $.totalLoad
            - type: Math@1
              path: $
              itemPath: $.totalLoad
              operation: Add
              valuePath: $.applianceTrocknerPower
              itemTargetPath: $.totalLoad
            - type: Math@1
              path: $
              itemPath: $.totalLoad
              operation: Add
              valuePath: $.chargingPower
              itemTargetPath: $.totalLoad
            - type: Math@1
              path: $
              itemPath: $.totalLoad
              operation: Subtract
              valuePath: $.totalPvPower
              itemTargetPath: $.gridActivePower
            - type: Project@1
              fields:
                - path: "$.tempBase"
                - path: "$.humidityBase"
                - path: "$.co2Base"
                - path: "$.luxBase"
                - path: "$.pvBase"
                - path: "$.socBase"
                - path: "$.valveBase"
                - path: "$.fanBase"
                - path: "$.meterHgEgBase"
                - path: "$.meterHgOgBase"
                - path: "$.meterHgDgBase"
                - path: "$.meterNgEgBase"
                - path: "$.wallboxLinksBase"
                - path: "$.wallboxRechtsBase"
                - path: "$.applianceWaschmaschineBase"
                - path: "$.applianceTrocknerBase"
                - path: "$.totalLoad"
            - type: ToPipelineDataEvent@1
              description: Send to entity updater
              targetPipelineRtId: 6789a00000000000000090c1
    associations:
      - roleId: System/ParentChild
        targetRtId: 6789a00000000000000090a3
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: "670000000000000000000002"
        targetCkTypeId: System.Communication/Adapter

  # ============================================================
  # PIPELINE 2 - Database Updates (Mesh Adapter)
  # Targets v2 Sensor/Valve/Damper entities instead of Space attributes.
  # ============================================================
  - rtId: 6789a00000000000000090c1
    ckTypeId: System.Communication/Pipeline
    attributes:
      - id: System/Name
        value: EnergyIQ Entity Updater
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromPipelineDataEvent@1
              description: Retrieve from event hub
          transformations:
            # ===== Wohnbereich EG (Space 11d1) =====
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010011a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010011a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010011a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich Illuminance sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010011a4"
              ckTypeId: EnergyIQ/IlluminanceSensor
              attributeUpdates:
                - attributeName: Illuminance
                  attributeValueType: Double
                  valuePath: $.illuminance
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020011b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich AirTerminal damper
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020011c2"
              ckTypeId: EnergyIQ/Damper
              attributeUpdates:
                - attributeName: DamperPosition
                  attributeValueType: Double
                  valuePath: $.damperPosition

            # ===== Buero EG (Space 12d2) =====
            - type: CreateUpdateInfo@1
              description: Update Buero EG Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010012a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Buero EG Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010012a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Buero EG CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010012a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Buero EG FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020012b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition
            - type: CreateUpdateInfo@1
              description: Update Buero EG AirTerminal damper
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020012c2"
              ckTypeId: EnergyIQ/Damper
              attributeUpdates:
                - attributeName: DamperPosition
                  attributeValueType: Double
                  valuePath: $.damperPosition

            # ===== Schlafzimmer OG (Space 21d8) =====
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010021a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010021a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010021a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020021b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer AirTerminal damper
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020021c2"
              ckTypeId: EnergyIQ/Damper
              attributeUpdates:
                - attributeName: DamperPosition
                  attributeValueType: Double
                  valuePath: $.damperPosition

            # ===== Kinderzimmer OG (Space 23da) =====
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010023a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010023a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010023a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020023b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer AirTerminal damper
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020023c2"
              ckTypeId: EnergyIQ/Damper
              attributeUpdates:
                - attributeName: DamperPosition
                  attributeValueType: Double
                  valuePath: $.damperPosition

            # ===== Aufenthaltsraum DG (Space 31de) =====
            - type: CreateUpdateInfo@1
              description: Update Aufenthalt Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010031a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Aufenthalt Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010031a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Aufenthalt CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010031a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Aufenthalt FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020031b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition

            # ===== Buero DG 1 (Space 32df) =====
            - type: CreateUpdateInfo@1
              description: Update Buero DG1 Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010032a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Buero DG1 Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
