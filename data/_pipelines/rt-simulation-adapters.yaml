            # ===== Stream-data archiving (AB#3442) =====
            # Same pattern as the Loxone "Store Control States" pipeline: every
            # archive gets the full $._updateItems; each archive node filters to
            # entities matching its TargetCkTypeId, items of other types are
            # skipped. BackfillFromRtEntity fills columns that are not part of
            # the current update batch from the entity before the row is saved.
            #
            # ── Room sensors ──
            - type: BackfillFromRtEntity@1
              description: Backfill TemperatureSensor archive
              path: $._updateItems
              archiveRtId: 6a0e000000000000000a0001
            - type: SaveStreamDataInArchive@1
              description: Save Temperature time-series
              path: $._updateItems
              archiveRtId: 6a0e000000000000000a0001
            - type: BackfillFromRtEntity@1
