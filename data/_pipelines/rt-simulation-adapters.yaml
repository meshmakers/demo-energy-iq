$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - System.Communication-[3.18,4.0)
  - EnergyIQ-2.0.0

# ============================================================
# EnergyIQ Simulation Data Flows (v2)
# ============================================================
# Simulates sensor data for 6 main rooms, PV system, and HVAC.
# Targets the v2 entity structure: Sensors, Valves, Dampers, HeatPump.
# Polling interval: 10 seconds
# ============================================================

entities:
  # ============================================================
  # SIMULATION INFRASTRUCTURE
  # ============================================================

  # Pool - Container for adapters
  - rtId: 6789a00000000000000090a1
    ckTypeId: System.Communication/Pool
    attributes:
      - id: System/Name
        value: EnergyIQ Simulation Pool
    associations: []

  # Adapter - Simulation adapter (Edge pool: no Helm chart needed)
  - rtId: 6789a00000000000000090a2
    ckTypeId: System.Communication/Adapter
    attributes:
      - id: System/Name
        value: EnergyIQ Simulator
      - id: System/Description
        value: Simulation adapter for EnergyIQ demo data
      - id: System.Communication/AdapterConfiguration
        value: ""
    associations:
      - roleId: System.Communication/Manages
        targetRtId: 6789a00000000000000090a1
        targetCkTypeId: System.Communication/Pool

  # DataFlow - Container for pipelines
  - rtId: 6789a00000000000000090a3
    ckTypeId: System.Communication/DataFlow
    attributes:
      - id: System/Name
        value: EnergyIQ Simulation DataFlow
      - id: System/Description
        value: Generates simulated sensor data for rooms, PV, and HVAC

  # ============================================================
  # PIPELINE 1 - Data Generation (Simulation Adapter)
  # ============================================================
  - rtId: 6789a00000000000000090b1
    ckTypeId: System.Communication/Pipeline
    attributes:
      - id: System/Name
        value: Simulation Data Generator
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromPolling@1
              interval: 00:00:10
          transformations:
            - type: Simulation@1
              simulations:
                - targetPath: tempBase
                  simulatorKey: Math.Sinus
                  configuration: "{periodMinutes:1440, phaseOffsetMinutes:360}"
                - targetPath: humidityBase
                  simulatorKey: Math.Sinus
                  configuration: "{periodMinutes:1440, phaseOffsetMinutes:480}"
                - targetPath: co2Base
                  simulatorKey: Math.Triangle
                  configuration: "{periodMinutes:240}"
                - targetPath: luxBase
                  simulatorKey: Math.Sinus
                  configuration: "{periodMinutes:1440, phaseOffsetMinutes:180}"
                - targetPath: pvBase
                  simulatorKey: Math.Sinus
                  configuration: "{periodMinutes:1440, phaseOffsetMinutes:180}"
                - targetPath: socBase
                  simulatorKey: Math.Triangle
                  configuration: "{periodMinutes:720}"
                - targetPath: valveBase
                  simulatorKey: Math.Sinus
                  configuration: "{periodMinutes:1440, phaseOffsetMinutes:540}"
                - targetPath: fanBase
                  simulatorKey: Math.Sinus
                  configuration: "{periodMinutes:480, phaseOffsetMinutes:60}"
            - type: SelectByPath@1
              selectPath:
                - path: "$.tempBase"
                  targetPath: temperature
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 18
                      scaleOutputMax: 24
                - path: "$.humidityBase"
                  targetPath: humidity
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 35
                      scaleOutputMax: 65
                - path: "$.co2Base"
                  targetPath: co2Level
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 500
                      scaleOutputMax: 900
                - path: "$.luxBase"
                  targetPath: illuminance
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 100
                      scaleOutputMax: 700
                - path: "$.valveBase"
                  targetPath: valvePosition
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 20
                      scaleOutputMax: 70
                - path: "$.valveBase"
                  targetPath: damperPosition
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 30
                      scaleOutputMax: 70
                - path: "$.pvBase"
                  targetPath: pvStringPower1
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 4.8
                - path: "$.pvBase"
                  targetPath: pvStringPower2
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 6.0
                - path: "$.pvBase"
                  targetPath: pvStringPower3
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 4.0
                - path: "$.pvBase"
                  targetPath: pvStringPower4
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 3.6
                - path: "$.pvBase"
                  targetPath: totalPvPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 18.4
                - path: "$.pvBase"
                  targetPath: inverterDcPower1
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 10.8
                - path: "$.pvBase"
                  targetPath: inverterAcPower1
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 10.4
                - path: "$.pvBase"
                  targetPath: inverterDcPower2
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 7.6
                - path: "$.pvBase"
                  targetPath: inverterAcPower2
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 7.3
                - path: "$.pvBase"
                  targetPath: gridFeedIn
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 12
                - path: "$.pvBase"
                  targetPath: selfConsumption
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 2
                      scaleOutputMax: 6
                - path: "$.socBase"
                  targetPath: stateOfCharge
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 30
                      scaleOutputMax: 90
                - path: "$.socBase"
                  targetPath: chargingPower
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 0
                      scaleOutputMax: 5
                - path: "$.tempBase"
                  targetPath: hpSupplyTemp
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 28
                      scaleOutputMax: 40
                - path: "$.tempBase"
                  targetPath: hpReturnTemp
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 22
                      scaleOutputMax: 32
                - path: "$.valveBase"
                  targetPath: hpModulation
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 30
                      scaleOutputMax: 80
                - path: "$.fanBase"
                  targetPath: ahuFanSpeed
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 40
                      scaleOutputMax: 80
                - path: "$.tempBase"
                  targetPath: ahuSupplyAirTemp
                  transformations:
                    - type: LinearScaler@1
                      scaleInputMin: 0
                      scaleInputMax: 1
                      scaleOutputMin: 18
                      scaleOutputMax: 22
            - type: Project@1
              fields:
                - path: "$.tempBase"
                - path: "$.humidityBase"
                - path: "$.co2Base"
                - path: "$.luxBase"
                - path: "$.pvBase"
                - path: "$.socBase"
                - path: "$.valveBase"
                - path: "$.fanBase"
            - type: ToPipelineDataEvent@1
              description: Send to entity updater
              targetPipelineRtId: 6789a00000000000000090c1
    associations:
      - roleId: System/ParentChild
        targetRtId: 6789a00000000000000090a3
        targetCkTypeId: System.Communication/DataFlow
      - roleId: System.Communication/Executes
        targetRtId: 6789a00000000000000090a2
        targetCkTypeId: System.Communication/Adapter

  # ============================================================
  # PIPELINE 2 - Database Updates (Mesh Adapter)
  # Targets v2 Sensor/Valve/Damper entities instead of Space attributes.
  # ============================================================
  - rtId: 6789a00000000000000090c1
    ckTypeId: System.Communication/Pipeline
    attributes:
      - id: System/Name
        value: EnergyIQ Entity Updater
      - id: System/Enabled
        value: true
      - id: System.Communication/PipelineDefinition
        value: >-
          triggers:
            - type: FromPipelineDataEvent@1
              description: Retrieve from event hub
          transformations:
            # ===== Wohnbereich EG (Space 11d1) =====
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010011a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010011a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010011a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich Illuminance sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010011a4"
              ckTypeId: EnergyIQ/IlluminanceSensor
              attributeUpdates:
                - attributeName: Illuminance
                  attributeValueType: Double
                  valuePath: $.illuminance
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020011b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition
            - type: CreateUpdateInfo@1
              description: Update Wohnbereich AirTerminal damper
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020011c2"
              ckTypeId: EnergyIQ/Damper
              attributeUpdates:
                - attributeName: DamperPosition
                  attributeValueType: Double
                  valuePath: $.damperPosition

            # ===== Buero EG (Space 12d2) =====
            - type: CreateUpdateInfo@1
              description: Update Buero EG Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010012a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Buero EG Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010012a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Buero EG CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010012a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Buero EG FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020012b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition
            - type: CreateUpdateInfo@1
              description: Update Buero EG AirTerminal damper
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020012c2"
              ckTypeId: EnergyIQ/Damper
              attributeUpdates:
                - attributeName: DamperPosition
                  attributeValueType: Double
                  valuePath: $.damperPosition

            # ===== Schlafzimmer OG (Space 21d8) =====
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010021a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010021a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010021a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020021b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition
            - type: CreateUpdateInfo@1
              description: Update Schlafzimmer AirTerminal damper
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020021c2"
              ckTypeId: EnergyIQ/Damper
              attributeUpdates:
                - attributeName: DamperPosition
                  attributeValueType: Double
                  valuePath: $.damperPosition

            # ===== Kinderzimmer OG (Space 23da) =====
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010023a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010023a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010023a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020023b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition
            - type: CreateUpdateInfo@1
              description: Update Kinderzimmer AirTerminal damper
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020023c2"
              ckTypeId: EnergyIQ/Damper
              attributeUpdates:
                - attributeName: DamperPosition
                  attributeValueType: Double
                  valuePath: $.damperPosition

            # ===== Aufenthaltsraum DG (Space 31de) =====
            - type: CreateUpdateInfo@1
              description: Update Aufenthalt Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010031a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Aufenthalt Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010031a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Aufenthalt CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010031a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Aufenthalt FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020031b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition

            # ===== Buero DG 1 (Space 32df) =====
            - type: CreateUpdateInfo@1
              description: Update Buero DG1 Temp sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010032a1"
              ckTypeId: EnergyIQ/TemperatureSensor
              attributeUpdates:
                - attributeName: Temperature
                  attributeValueType: Double
                  valuePath: $.temperature
            - type: CreateUpdateInfo@1
              description: Update Buero DG1 Humidity sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010032a2"
              ckTypeId: EnergyIQ/HumiditySensor
              attributeUpdates:
                - attributeName: Humidity
                  attributeValueType: Double
                  valuePath: $.humidity
            - type: CreateUpdateInfo@1
              description: Update Buero DG1 CO2 sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010032a3"
              ckTypeId: EnergyIQ/CO2Sensor
              attributeUpdates:
                - attributeName: CO2Level
                  attributeValueType: Double
                  valuePath: $.co2Level
            - type: CreateUpdateInfo@1
              description: Update Buero DG1 Illuminance sensor
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000010032a4"
              ckTypeId: EnergyIQ/IlluminanceSensor
              attributeUpdates:
                - attributeName: Illuminance
                  attributeValueType: Double
                  valuePath: $.illuminance
            - type: CreateUpdateInfo@1
              description: Update Buero DG1 FBH valve
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000020032b2"
              ckTypeId: EnergyIQ/Valve
              attributeUpdates:
                - attributeName: ValvePosition
                  attributeValueType: Double
                  valuePath: $.valvePosition

            # ===== PV / Inverter / Battery (unchanged in v2) =====
            - type: CreateUpdateInfo@1
              description: Update PV System
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000000080a1"
              ckTypeId: EnergyIQ/PhotovoltaicSystem
              attributeUpdates:
                - attributeName: TotalCurrentPower
                  attributeValueType: Double
                  valuePath: $.totalPvPower
                - attributeName: GridFeedIn
                  attributeValueType: Double
                  valuePath: $.gridFeedIn
                - attributeName: SelfConsumption
                  attributeValueType: Double
                  valuePath: $.selfConsumption
            - type: CreateUpdateInfo@1
              description: Update PV String 1
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000000081b1"
              ckTypeId: EnergyIQ/PVString
              attributeUpdates:
                - attributeName: CurrentPower
                  attributeValueType: Double
                  valuePath: $.pvStringPower1
            - type: CreateUpdateInfo@1
              description: Update PV String 2
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000000082b2"
              ckTypeId: EnergyIQ/PVString
              attributeUpdates:
                - attributeName: CurrentPower
                  attributeValueType: Double
                  valuePath: $.pvStringPower2
            - type: CreateUpdateInfo@1
              description: Update PV String 3
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000000083b3"
              ckTypeId: EnergyIQ/PVString
              attributeUpdates:
                - attributeName: CurrentPower
                  attributeValueType: Double
                  valuePath: $.pvStringPower3
            - type: CreateUpdateInfo@1
              description: Update PV String 4
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000000084b4"
              ckTypeId: EnergyIQ/PVString
              attributeUpdates:
                - attributeName: CurrentPower
                  attributeValueType: Double
                  valuePath: $.pvStringPower4
            - type: CreateUpdateInfo@1
              description: Update Inverter 1
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000000085c1"
              ckTypeId: EnergyIQ/Inverter
              attributeUpdates:
                - attributeName: DcPower
                  attributeValueType: Double
                  valuePath: $.inverterDcPower1
                - attributeName: AcPower
                  attributeValueType: Double
                  valuePath: $.inverterAcPower1
            - type: CreateUpdateInfo@1
              description: Update Inverter 2
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000000086c2"
              ckTypeId: EnergyIQ/Inverter
              attributeUpdates:
                - attributeName: DcPower
                  attributeValueType: Double
                  valuePath: $.inverterDcPower2
                - attributeName: AcPower
                  attributeValueType: Double
                  valuePath: $.inverterAcPower2
            - type: CreateUpdateInfo@1
              description: Update Battery Storage
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000000087d1"
              ckTypeId: EnergyIQ/BatteryStorage
              attributeUpdates:
                - attributeName: StateOfCharge
                  attributeValueType: Double
                  valuePath: $.stateOfCharge
                - attributeName: ChargingPower
                  attributeValueType: Double
                  valuePath: $.chargingPower

            # ===== HeatPump (formerly Boiler in v1) =====
            - type: CreateUpdateInfo@1
              description: Update HeatPump
              targetPath: $._updateItems
              targetValueKind: Array
              targetValueWriteMode: Append
              updateKind: UPDATE
              rtId: "6789a00000000000000060f1"
              ckTypeId: EnergyIQ/HeatPump
              attributeUpdates:
                - attributeName: SupplyTemp
                  attributeValueType: Double
                  valuePath: $.hpSupplyTemp
                - attributeName: ReturnTemp
                  attributeValueType: Double
                  valuePath: $.hpReturnTemp
                - attributeName: ModulationLevel
                  attributeValueType: Double
