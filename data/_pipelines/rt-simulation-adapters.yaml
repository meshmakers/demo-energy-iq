            - type: If@1
              description: Deckenleuchte Buero DG1 is on (dimming > 10 %)
              path: $.data.dimmingLevel
              operator: GreaterThan
              value: 10
              valueType: Double
              transformations:
                - type: CreateUpdateInfo@1
                  description: Update Deckenleuchte Buero DG1 (on)
                  targetPath: $._updateItems
                  targetValueKind: Array
                  targetValueWriteMode: Append
                  updateKind: UPDATE
                  rtId: "6789a00000000000000072f6"
                  ckTypeId: EnergyIQ/Luminaire
                  attributeUpdates:
                    - attributeName: IsOn
                      attributeValueType: Boolean
                      value: true
                    - attributeName: DimmingLevel
                      attributeValueType: Double
                      valuePath: $.data.dimmingLevel
            - type: If@1
              description: Deckenleuchte Buero DG1 is off (dimming <= 10 %)
              path: $.data.dimmingLevel
              operator: LessEqualsThan
              value: 10
              valueType: Double
              transformations:
                - type: CreateUpdateInfo@1
                  description: Update Deckenleuchte Buero DG1 (off)
                  targetPath: $._updateItems
                  targetValueKind: Array
                  targetValueWriteMode: Append
                  updateKind: UPDATE
                  rtId: "6789a00000000000000072f6"
                  ckTypeId: EnergyIQ/Luminaire
                  attributeUpdates:
