$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
  - System.Communication-[4.0,5.0)
entities:
  # The mesh adapter is auto-provisioned by the System.Communication blueprint
  # (rtId 670000000000000000000002); only the on-premise edge adapter is defined here.
  # Edge deployment site for the on-premise Loxone adapter (called Pool before System.Communication
  # 4.0.0; Manages was renamed Hosts). Edge sites (Environment = 0) are NOT
  # deployed by the central Communication Operator — the adapter process runs outside
  # the cluster (here: the local edge worker started via Start-Octo).
  - rtId: 67f0a01ec4ff02221e0b5000
    ckTypeId: System.Communication/DeploymentSite
    attributes:
      - id: System/Name
        value: Firmianstraße Edge
      - id: System/Description
        value: Edge deployment site at Firmianstraße (device mm-octo-mesh-edge-0001); hosts the on-premise Loxone adapter (Miniserver).
      - id: System.Communication/Environment
        value: 0
  - rtId: 67f0a01ec4ff02221e0b5001
    ckTypeId: System.Communication/Adapter
    attributes:
      - id: System/Name
        value: Loxone Edge Adapter
    associations:
      - roleId: System.Communication/Hosts
        targetRtId: 67f0a01ec4ff02221e0b5000
        targetCkTypeId: System.Communication/DeploymentSite
