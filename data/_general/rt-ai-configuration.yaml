$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
dependencies:
- System.Communication-[3.13,)
entities:
  - rtId: 67f0c00ec4ff02221e0b7003
    ckTypeId: System.Communication/AiConfiguration
    rtWellKnownName: AnthropicAiConfig
    attributes:
      # Secret — intentionally NOT committed. Set the real Anthropic key after import
      # (Refinery Studio → Configurations → AnthropicAiConfig, or a GraphQL update). Re-running
      # the import resets this to the placeholder, so re-enter the key after each (re-)provision.
      - id: System.Communication/ApiKey
        value: "<anthropic-api-key-here>"
      # Mandatory since System.Communication 3.24.0 (no default). Keep this a current model id —
      # pinned dated snapshots (e.g. "…-20250514") get retired and return HTTP 404 not_found.
      - id: System.Communication/AiModel
        value: "claude-sonnet-4-6"
      - id: System.Communication/MaxTokens
        value: 8000
      - id: System.Communication/Temperature
        value: 0.0
      - id: System.Communication/McpServerUrl
        value: "https://localhost:5017"
