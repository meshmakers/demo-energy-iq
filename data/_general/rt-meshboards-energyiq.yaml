          {"timeFilter": {"enabled": true, "selection": {"type": "relative", "relativeValue": 24, "relativeUnit": "hours"}}, "entitySelectors": [{"id": "raum", "label": "Raum", "ckTypeId": "EnergyIQ/Space", "attributeMappings": [{"attributePath": "name", "variableName": "raumName"}], "showInToolbar": true, "defaultRtId": "6789a00000000000000011d1", "childScope": {"targetCkTypeId": "EnergyIQ/TemperatureSensor", "roleId": "EnergyIQ/SpaceSensors", "direction": "in"}}], "autoRefreshSeconds": 300}
      - id: System.UI/Dashboard.Columns
        value: 12
      - id: System.UI/Dashboard.RowHeight
        value: 50
      - id: System.UI/Dashboard.Gap
        value: 8

