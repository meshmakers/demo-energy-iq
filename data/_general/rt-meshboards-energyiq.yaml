  # ============================================================
  # Dashboard: Energiebilanz (cumulated kWh over the time filter)
  #
  # Each KPI runs a persistent AggregationSdQuery (SUM of the value column,
  # optionally sign-filtered) bound to the board time filter and converts the
  # kW-sample sum to kWh via the KPI valueMultiplier 10/3600 (simulator writes
  # every 10 s, uniform sampling — SUM is linear, so the factor holds for any
  # window). "Batterie entladen" uses the NEGATED multiplier on the < 0-filtered
  # sum to display positive kWh discharged.
