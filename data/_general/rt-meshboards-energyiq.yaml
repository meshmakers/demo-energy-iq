          {"chartType": "line", "categoryField": "timestamp", "seriesGroupField": "name", "valueField": "CurrentValue", "showLegend": true, "legendPosition": "bottom", "showMarkers": false, "showDataBadge": true, "queryName": "Raumtemperaturen (Archiv)", "queryRtId": "6a4a9ca67e487162fbe38608", "queryFamily": "streamData", "entitySelectorId": "raum", "resolutionAware": true, "requiredAggregation": "AVG"}

