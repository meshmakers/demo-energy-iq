            attributes:
              - id: System/AttributePath
                value: DimmingLevel
              - id: System/AggregationType
                # 5 = TimeWeightedAverage (AB#4336) - real duty cycle via LOCF over the
                # event-based status rows; 3 (Average) was sample-weighted and wrong for duration.
                value: 5

