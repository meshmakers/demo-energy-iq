ckTypeId: EnergyIQ/Luminaire
phSpec: ph::Equip
markers:
  - equip
  - lighting
  - luminaire
tags:
  - { name: dis, sourceAttribute: System/Name }
refs:
  - phRef: spaceRef
    sourceRole: EnergyIQ/SpaceElements
    direction: parent
    targetCkTypeId: EnergyIQ/Space
attributes:
  - ckAttribute: LuminaireTypeValue
    phTag: luminaireType
    kind: Str
    enumMapping:
      0: ceiling
      1: pendant
      2: recessed
      3: wall
      4: floor
      5: desk
      6: emergency
  - ckAttribute: RatedPower
    phTag: nomPower
    kind: Number
    unit: "W"
points:
  - ckAttribute: IsOn
    markers: [point, sensor, lighting, run]
    kind: Bool
    refTo: { phRef: equipRef, target: self }
    navName: on
  - ckAttribute: DimmingLevel
    markers: [point, sensor, lighting, level]
    kind: Number
    unit: "%"
    refTo: { phRef: equipRef, target: self }
    navName: level
  - ckAttribute: DimmingLevelSetpoint
    markers: [point, sp, cmd, lighting, level]
    kind: Number
    unit: "%"
    refTo: { phRef: equipRef, target: self }
    navName: levelSp
    writable: true
