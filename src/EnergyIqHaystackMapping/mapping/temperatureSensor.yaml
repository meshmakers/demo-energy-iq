ckTypeId: EnergyIQ/TemperatureSensor
phSpec: ph::Number-Point
# Each TemperatureSensor entity emits one PH Point dict (1:1).
markers:
  - point
  - sensor
  - temp
  - air
  - zone
tags:
  - { name: dis, sourceAttribute: System/Name }
  - { name: kind, value: "Number" }
  - { name: unit, value: "°C" }
refs:
  - phRef: spaceRef
    sourceRole: EnergyIQ/SpaceSensors
    direction: parent
    targetCkTypeId: EnergyIQ/Space
  - phRef: equipRef
    sourceRole: EnergyIQ/EquipmentSensors
    direction: parent
attributes:
  - ckAttribute: CurrentValue
    phTag: curVal
    kind: Number
    unit: "°C"
  - ckAttribute: LastUpdate
    phTag: curStatus
    kind: Str
    # Renderer sets curStatus="ok" if recent, otherwise "stale" / "fault" — derived
  - ckAttribute: SensorManufacturer
    phTag: equipMaker
    kind: Str
  - ckAttribute: SensorModel
    phTag: equipModel
    kind: Str
