ckTypeId: EnergyIQ/TemperatureSensor
phSpec: ph::Number-Point
# Each TemperatureSensor entity emits one PH Point dict (1:1).
markers:
  - point
  - sensor
  - temp
  - air
  - zone
tags:
  - { name: dis, sourceAttribute: System/Name }
  - { name: kind, value: "Number" }
  - { name: unit, value: "°C" }
refs:
  - phRef: spaceRef
    sourceRole: EnergyIQ/SpaceSensors
    direction: parent
    targetCkTypeId: EnergyIQ/Space
  - phRef: equipRef
    sourceRole: EnergyIQ/EquipmentSensors
    direction: parent
attributes:
  # Note: ckAttribute references the underlying global attribute id (`Temperature`),
  # not the display name `CurrentValue` at the type. The RT YAML stores attributes
  # by global id, so the mapping must match that. Same pattern below for all sensors,
  # actuators and terminals.
  - ckAttribute: Temperature
    phTag: curVal
    kind: Number
    unit: "°C"
  - ckAttribute: LastValueUpdate
    phTag: curStatus
    kind: Str
    # Renderer sets curStatus="ok" if recent, otherwise "stale" / "fault" — derived
  - ckAttribute: SensorManufacturer
    phTag: equipMaker
    kind: Str
  - ckAttribute: SensorModel
    phTag: equipModel
    kind: Str
