    phTag: yearBuilt
    kind: Number
  - ckAttribute: ElevationOfRefHeight
    phTag: elevation
    kind: Number
    unit: "m"
  - ckAttribute: AddressValue.Street
    phTag: geoStreet
    kind: Str
  - ckAttribute: AddressValue.PostalCode
    phTag: geoPostalCode
    kind: Str
  - ckAttribute: AddressValue.City
    phTag: geoCity
    kind: Str
  - ckAttribute: AddressValue.Country
    phTag: geoCountry
    kind: Str
