    sourceRole: System/ParentChild
    direction: ancestor
    targetCkTypeId: EnergyIQ/Site
attributes:
  - ckAttribute: LongName
    phTag: navName
    kind: Str
  - ckAttribute: GrossFloorArea
    phTag: area
    kind: Number
