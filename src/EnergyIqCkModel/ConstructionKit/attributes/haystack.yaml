$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
attributes:
# HaystackRef record attributes
- id: RefName
  valueType: String
  description: "Haystack reference name (e.g. equipRef, spaceRef, siteRef)"
- id: TargetId
  valueType: String
  description: "GlobalId of the target object"

# Haystack tagging attributes for types
- id: HaystackTags
  valueType: StringArray
  description: "Haystack marker tags (e.g. ahu, hvac, equip)"
- id: HaystackMeta
  valueType: String
  description: "Additional Haystack metadata as JSON string"
