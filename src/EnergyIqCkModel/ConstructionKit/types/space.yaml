$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: Space
  derivedFromCkTypeId: ${Basic}/TreeNode
  description: "Room - central object for energy optimization (IFC: IfcSpace + VDI 3814 Raumautomation). Sensors/Actuators/Terminals are modeled as separate entities and linked via SpaceSensors/SpaceActuators/SpaceTerminals."
  attributes:
  # IFC identification
  - id: ${this}/GlobalId
    name: GlobalId
    isOptional: true
  - id: ${this}/LongName
    name: LongName
    isOptional: true
  # ISO 4157-2/3: Room designation
  - id: ${this}/RoomNumber
    name: RoomNumber
    isOptional: true
  - id: ${this}/RoomIdentifier
    name: RoomIdentifier
    isOptional: true
  # Master data (IFC + VDI 3814)
  - id: ${this}/SpaceTypeValue
    name: SpaceType
    isOptional: true
  - id: ${this}/PredefinedType
    name: PredefinedType
    isOptional: true
  - id: ${this}/NetFloorArea
    name: NetFloorArea
    isOptional: true
  - id: ${this}/GrossFloorArea
    name: GrossFloorArea
    isOptional: true
  - id: ${this}/CeilingHeight
    name: CeilingHeight
    isOptional: true
  # IFC Pset_* design / operational requirements (records)
  - id: ${this}/ThermalRequirementsRecord
    name: ThermalRequirements
    isOptional: true
  - id: ${this}/LightingRequirementsRecord
    name: LightingRequirements
    isOptional: true
  - id: ${this}/OccupancyRequirementsRecord
    name: OccupancyRequirements
    isOptional: true
  # Operating mode (VDI 3814) - room-level mode is valid (Comfort/Economy/Standby/...)
  - id: ${this}/OperatingModeValue
    name: OperatingMode
    isOptional: true
