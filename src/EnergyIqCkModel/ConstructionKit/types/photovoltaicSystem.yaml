$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: PhotovoltaicSystem
  derivedFromCkTypeId: ${Basic}/NamedEntity
  description: "Photovoltaic system - logical grouping of PV strings, inverters and battery (IFC: IfcSystem). A pure logical aggregate (NamedEntity, NOT a spatial TreeNode): it lives in the Systems view only. Its physical components (PVString/Inverter/BatteryStorage) are anchored in the spatial tree where they actually sit (roofs, Technikraum) and are grouped here via the outbound SystemMembers association. The PhotovoltaicSystem is itself a member of the electrical DistributionSystem via inbound MemberOfSystem (nested IfcSystem)."
  attributes:
  - id: ${this}/Identifier
    name: Identifier
  # Aggregate values
  - id: ${this}/TotalRatedPowerKWp
    name: TotalRatedPower
    isOptional: true
  - id: ${this}/TotalCurrentPowerKW
    name: TotalCurrentPower
    isOptional: true
  - id: ${this}/TotalEnergyProducedKWh
    name: TotalEnergyProduced
    isOptional: true
  - id: ${this}/GridFeedIn
    name: GridFeedIn
    isOptional: true
  - id: ${this}/SelfConsumption
    name: SelfConsumption
    isOptional: true
  # Status
  - id: ${this}/IsRunning
    name: IsRunning
    isOptional: true
  - id: ${this}/FaultState
    name: FaultState
    isOptional: true
  associations:
  # Groups the physical PV components (PVString, Inverter, BatteryStorage). Reuses the
  # SystemMembers role so the Systems-view navigation is uniform across every logical
  # system: outbound SystemMembers = components, inbound MemberOfSystem (on each component)
  # points back to this PV system. IFC IfcRelAssignsToGroup (nested IfcSystem).
  - id: ${this}/SystemMembers
    targetCkTypeId: ${Basic}/NamedEntity
