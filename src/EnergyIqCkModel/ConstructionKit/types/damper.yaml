$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: Damper
  derivedFromCkTypeId: ${this}/Actuator
  description: "Damper actuator (IFC: IfcDamper)."
  attributes:
  - id: ${this}/DamperPosition
    name: Position
    isOptional: true
  - id: ${this}/DamperPositionSetpoint
    name: PositionSetpoint
    isOptional: true
  - id: ${this}/AirflowRate
    name: AirflowRate
    isOptional: true
  - id: ${this}/AirflowSetpoint
    name: AirflowSetpoint
    isOptional: true
