$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: Building
  derivedFromCkTypeId: ${Basic}/TreeNode
  description: "Building (IFC: IfcBuilding)"
  attributes:
  # IFC identification
  - id: ${this}/GlobalId
    name: GlobalId
    isOptional: true
  - id: ${this}/LongName
    name: LongName
    isOptional: true
  # Building-specific (IFC)
  - id: ${this}/ElevationOfRefHeight
    name: ElevationOfRefHeight
    isOptional: true
  - id: ${this}/AddressValue
    name: BuildingAddress
    isOptional: true
  - id: ${this}/YearOfConstruction
    name: YearOfConstruction
    isOptional: true
  - id: ${this}/GrossFloorArea
    name: GrossFloorArea
    isOptional: true
  # Parent (Site), Children (BuildingStorey, TechnicalSystem) via inherited System/ParentChild
