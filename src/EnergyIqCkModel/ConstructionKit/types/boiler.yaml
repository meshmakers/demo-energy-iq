$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: Boiler
  derivedFromCkTypeId: ${this}/TechnicalSystem
  description: "Heating boiler (IFC: IfcBoiler, VDI 3814)"
  attributes:
  - id: ${this}/SupplyTemp
    name: SupplyTemp
    isOptional: true
  - id: ${this}/ReturnTemp
    name: ReturnTemp
    isOptional: true
  - id: ${this}/SupplyTempSetpoint
    name: SupplyTempSetpoint
    isOptional: true
  - id: ${this}/ModulationLevel
    name: ModulationLevel
    isOptional: true
  - id: ${this}/FuelConsumption
    name: FuelConsumption
    isOptional: true
  - id: ${this}/Efficiency
    name: Efficiency
    isOptional: true
  associations:
  - id: ${this}/SystemSpaces
    targetCkTypeId: ${this}/Space
  - id: ${this}/EquipmentSensors
    targetCkTypeId: ${this}/Sensor
  - id: ${this}/EquipmentActuators
    targetCkTypeId: ${this}/Actuator
  - id: ${this}/TerminalServedBy
    targetCkTypeId: ${this}/RoomTerminal
